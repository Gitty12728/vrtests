<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame VR - Tanzende Puppen (Quest 2 + Höhensteuerung)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script>
      // Dieses Skript liest die Tasten direkt aus der Hardware (Quest 2 Controller)
      AFRAME.registerComponent('quest-height-fix', {
        init: function () {
          this.rigEl = document.getElementById('rig');
          // Zustandsspeicher, damit ein Tastendruck nicht unendlich oft pro Sekunde feuert
          this.aPressed = false;
          this.bPressed = false;
        },
        
        tick: function () {
          // Prüfen, ob wir uns im VR-Modus befinden und Gamepads existieren
          if (!this.el.sceneEl.is('vr-mode')) return;
          
          const session = this.el.sceneEl.xrSession;
          if (!session) return;
          
          const inputSources = session.inputSources;
          if (!inputSources) return;

          // Wir gehen alle angeschlossenen Controller durch
          for (let i = 0; i < inputSources.length; i++) {
            const inputSource = inputSources[i];
            
            // Uns interessiert nur der rechte Controller (hand: "right")
            if (inputSource.handedness === 'right' && inputSource.gamepad) {
              const buttons = inputSource.gamepad.buttons;
              
              // Standard WebXR Mapping für Oculus/Meta Quest:
              // buttons[4] ist die A-Taste
              // buttons[5] ist die B-Taste
              
              // --- A-TASTE (HOCH) ---
              if (buttons[4] && buttons[4].pressed) {
                if (!this.aPressed) { // Nur beim ersten Runterdrücken ausführen
                  this.changeHeight(0.10);
                  this.aPressed = true;
                }
              } else {
                this.aPressed = false; // Zurücksetzen, wenn losgelassen
              }
              
              // --- B-TASTE (RUNTER) ---
              if (buttons[5] && buttons[5].pressed) {
                if (!this.bPressed) {
                  this.changeHeight(-0.10);
                  this.bPressed = true;
                }
              } else {
                this.bPressed = false;
              }
            }
          }
        },

        changeHeight: function (amount) {
          if (this.rigEl) {
            // Direktes Verändern der 3D-Matrix (das funktioniert immer, ohne Glitch)
            this.rigEl.object3D.position.y += amount;
            console.log("Höhe geändert um: " + amount + "m. Aktuelle Höhe: " + this.rigEl.object3D.position.y);
          }
        }
      });
    </script>

    <style>
      /* Desktop-UI für den Test ohne Brille */
      #ui-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        gap: 15px;
        font-family: sans-serif;
      }
      .anim-btn {
        background: rgba(255, 255, 255, 0.9);
        border: 2px solid #2e7d32;
        border-radius: 8px;
        color: #1b5e20;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .anim-btn:hover { background: #2e7d32; color: white; }
    </style>
  </head>
  <body>

    <div id="ui-container">
      <button class="anim-btn" onclick="playAnimation(0)">Animation 1</button>
      <button class="anim-btn" onclick="playAnimation(1)">Animation 2</button>
      <button class="anim-btn" onclick="playAnimation(2)">Animation 3</button>
    </div>

    <a-scene webxr="optionalFeatures: local-floor, bounded-floor" quest-height-fix>
      <a-assets>
        <a-asset-item id="frauen-model" src="tanzendepuppen.glb"></a-asset-item>
      </a-assets>

      <a-entity id="rig" 
                movement-controls="controls: checkpoint, gamepad, keyboard; speed: 0.15;" 
                position="0 0 4">
        
        <a-entity camera 
                  position="0 1.6 0" 
                  look-controls="pointerLockEnabled: false">
        </a-entity>

        <a-entity oculus-touch-controls="hand: left" 
                  gamepad-controls="controller: 0">
        </a-entity>

        <a-entity oculus-touch-controls="hand: right" 
                  snap-turn-controls="target: #rig; turnAngle: 45">
        </a-entity>
        
      </a-entity>
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 4 2"></a-light>

      <a-sphere id="hügel" 
                position="0 -2 -4" 
                radius="4" 
                scale="2 0.6 2" 
                color="#558b2f" 
                roughness="0.9">
      </a-sphere>

      <a-plane position="0 0 0" 
               rotation="-90 0 0" 
               width="100" 
               height="100" 
               color="#689f38" 
               roughness="1">
      </a-plane>

      <a-sky color="#81d4fa"></a-sky>

      <a-entity id="frauen" 
                gltf-model="#frauen-model" 
                position="0 0.3 -4" 
                scale="1 1 1"
                animation-mixer="clip: *; loop: repeat; timeScale: 1">
      </a-entity>
    </a-scene>

    <script>
      // Funktion zum Umschalten der 3 im GLB enthaltenen Animationen
      function playAnimation(index) {
        const modelEl = document.querySelector('#frauen');
        const modelComponent = modelEl.components['gltf-model'];
        
        if (modelComponent && modelEl.object3D) {
          const mesh = modelEl.object3D.children[0];
          if (mesh && mesh.animations && mesh.animations.length > 0) {
            if (mesh.animations[index]) {
              const clipName = mesh.animations[index].name;
              modelEl.setAttribute('animation-mixer', {
                clip: clipName,
                crossFadeDuration: 0.5
              });
              console.log("Spiele Animation: " + clipName);
            }
          }
        }
      }

      // Automatisch die erste Animation starten, sobald das Modell da ist
      document.querySelector('#frauen').addEventListener('model-loaded', () => {
        setTimeout(() => playAnimation(0), 500);
      });
    </script>
  </body>
</html>
