<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>p2vr VR Umgebung - Tanzende Puppen</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <script>
      AFRAME.registerComponent('quest-stick-controls', {
        schema: {
          speed: { type: 'number', default: 3.0 },
          snapAngle: { type: 'number', default: 30 },
          cooldown: { type: 'number', default: 300 },
          heightStep: { type: 'number', default: 0.2 },
          easing: { type: 'number', default: 0.08 }
        },
        init: function () {
          this.lastTurn = 0;
          this.moveDir = new AFRAME.THREE.Vector3();
          this.targetVelocity = new AFRAME.THREE.Vector3();
          this.currentVelocity = new AFRAME.THREE.Vector3();
          this.camQuat = new AFRAME.THREE.Quaternion();
          this.cameraEl = this.el.querySelector('[camera]');
          this.soundPlaying = false;
          
          this.leftStick = { x: 0, y: 0 };
          this.rightStick = { x: 0 };

          this.aPressed = false;
          this.bPressed = false;

          const leftHand = document.querySelector('#leftHand');
          const rightHand = document.querySelector('#rightHand');

          leftHand.addEventListener('axismove', (evt) => {
            if (evt.detail.axis.length >= 4) {
              this.leftStick.x = evt.detail.axis[2];
              this.leftStick.y = evt.detail.axis[3];
            } else {
              this.leftStick.x = evt.detail.axis[0];
              this.leftStick.y = evt.detail.axis[1];
            }
          });

          rightHand.addEventListener('axismove', (evt) => {
            if (evt.detail.axis.length >= 4) {
              this.rightStick.x = evt.detail.axis[2];
            } else {
              this.rightStick.x = evt.detail.axis[0];
            }
          });

          window.addEventListener('keydown', (evt) => {
            if (evt.code === 'Space') {
              evt.preventDefault();
              this.el.object3D.position.y += this.data.heightStep;
            }
            if (evt.code === 'ControlLeft' || evt.code === 'ControlRight') {
              evt.preventDefault();
              this.el.object3D.position.y -= this.data.heightStep;
            }
          });
        },
        tick: function (time, delta) {
          if (this.el.sceneEl.is('vr-mode')) {
            const session = this.el.sceneEl.xrSession;
            if (session && session.inputSources) {
              for (let i = 0; i < session.inputSources.length; i++) {
                const inputSource = session.inputSources[i];
                
                if (inputSource.handedness === 'right' && inputSource.gamepad) {
                  const buttons = inputSource.gamepad.buttons;

                  // A-Taste (Index 4)
                  if (buttons[4] && buttons[4].pressed) {
                    if (!this.aPressed) {
                      this.el.object3D.position.y += this.data.heightStep;
                      this.aPressed = true;
                    }
                  } else {
                    this.aPressed = false;
                  }

                  // B-Taste (Index 5)
                  if (buttons[5] && buttons[5].pressed) {
                    if (!this.bPressed) {
                      this.el.object3D.position.y -= this.data.heightStep;
                      this.bPressed = true;
                    }
                  } else {
                    this.bPressed = false;
                  }
                }
              }
            }
          }

          const moveX = Math.abs(this.leftStick.x) > 0.2 ? this.leftStick.x : 0;
          const moveZ = Math.abs(this.leftStick.y) > 0.2 ? this.leftStick.y : 0;

          this.targetVelocity.set(0, 0, 0);

          if (moveX !== 0 || moveZ !== 0) {
            if (this.cameraEl) {
              this.cameraEl.object3D.getWorldQuaternion(this.camQuat);
            } else {
              this.camQuat.copy(this.el.object3D.quaternion);
            }

            this.moveDir.set(moveX, 0, moveZ);
            this.moveDir.applyQuaternion(this.camQuat);
            this.moveDir.y = 0;
            this.moveDir.normalize();

            this.targetVelocity.copy(this.moveDir).multiplyScalar(this.data.speed);
          }

          this.currentVelocity.lerp(this.targetVelocity, this.data.easing);

          if (this.currentVelocity.lengthSq() > 0.05) {
            if (!this.soundPlaying) {
              this.el.components.sound.playSound();
              this.soundPlaying = true;
            }
          } else {
            if (this.soundPlaying) {
              this.el.components.sound.stopSound();
              this.soundPlaying = false;
            }
          }

          if (this.currentVelocity.lengthSq() > 0.0001) {
            const deltaSeconds = delta / 1000;
            this.el.object3D.position.addScaledVector(this.currentVelocity, deltaSeconds);
          }

          const turnX = this.rightStick.x;
          if (Math.abs(turnX) > 0.7 && time - this.lastTurn > this.data.cooldown) {
            const direction = turnX > 0 ? -1 : 1;
            const turnAngle = (this.data.snapAngle * direction) * (Math.PI / 180);
            this.el.object3D.rotation.y += turnAngle;
            this.lastTurn = time;
          }
        }
      });
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      .hint { position: absolute; left: 16px; top: 16px; color: white; font-family: sans-serif; z-index: 10; pointer-events: none; }
      .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.86);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: sans-serif;
        z-index: 20;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      VR: Links = bewegen, Rechts = Snap Turn | A / B = hoch / runter <br />
      Desktop: WASD + Maus drehen | Leertaste = hoch, Strg = runter
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <span>Lade 3D-Modell, bitte warten...</span>
    </div>

    <a-scene background="color: #111" vr-mode-ui="enabled: true" renderer="colorManagement: true; toneMapping: ACESFilmic;" loading-screen="enabled: false">
      <a-assets>
        <a-asset-item id="sceneModel" 
                      crossorigin="anonymous" 
                      timeout="600000" 
                      src="tanzendepuppen.glb"></a-asset-item>
        
        <audio id="stepSound" src="step.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="0 5 3" rotation="-45 0 0"></a-entity>
      <a-entity light="type: directional; intensity: 0.4" position="-3 4 -2"></a-entity>

      <a-entity id="rig" 
                position="0 0 0" 
                quest-stick-controls="speed: 3.0; snapAngle: 30; cooldown: 300; heightStep: 0.2; easing: 0.08"
                sound="src: #stepSound; loop: true; autoplay: false; volume: 1">
                
        <a-entity id="camera" position="0 1.8 0" camera look-controls="pointerLockEnabled: true; reverseMouseDrag: false" wasd-controls="enabled: true"></a-entity>

        <a-entity id="leftHand" oculus-touch-controls="hand: left; model: true"></a-entity>
        <a-entity id="rightHand" oculus-touch-controls="hand: right; model: true"></a-entity>
      </a-entity>

      <a-entity gltf-model="#sceneModel" 
                position="0 0 -4" 
                rotation="0 0 0" 
                scale="1 1 1"
                animation-mixer="clip: *; loop: repeat">
      </a-entity>

      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#444" shadow="receive: true"></a-plane>
      <a-sky color="#000"></a-sky>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const overlay = document.getElementById('loadingOverlay');
        const scene = document.querySelector('a-scene');
        
        scene.addEventListener('loaded', function () {
          overlay.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
