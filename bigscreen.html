<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>VR Tour - Perfekte Orangenschnitte mit Dynamic UI</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>
        // 1. SHADER: ORANGENSCHNITTE (Exakt nach image_76b5fc.png)
        AFRAME.registerShader('orange-slice-mask', {
            schema: {
                angle: {type: 'number', default: 35},
                feather: {type: 'number', default: 4},
                color: {type: 'color', default: '#020202'},
                opacity: {type: 'number', default: 0.88}
            },
            vertexShader: `
                varying vec3 vLocalPosition;
                void main() {
                    vLocalPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vLocalPosition;
                uniform vec3 color;
                uniform float opacity;
                uniform float angle;
                uniform float feather;
                
                void main() {
                    vec3 dir = normalize(vLocalPosition);
                    float azimuth = atan(dir.x, -dir.z);
                    float degAbs = degrees(abs(azimuth));
                    float halfAngle = angle / 2.0;
                    
                    float mask = smoothstep(halfAngle, halfAngle + feather, degAbs);
                    gl_FragColor = vec4(color, mask * opacity);
                }
            `
        });

        // 2. VR-STEUERUNG: DAUMENSTICK-LOCOMOTION
        AFRAME.registerComponent('joystick-move', {
            schema: {
                rig: {type: 'selector', default: '#cameraRig'},
                speed: {type: 'number', default: 2.0}
            },
            init: function () {
                this.moveX = 0;
                this.moveY = 0;
                this.el.addEventListener('thumbstickmoved', (evt) => {
                    this.moveX = evt.detail.x;
                    this.moveY = evt.detail.y;
                });
            },
            tick: function (time, delta) {
                if (Math.abs(this.moveX) < 0.15 && Math.abs(this.moveY) < 0.15) return;
                const rig = this.data.rig.object3D;
                const cam = document.querySelector('#head').object3D;
                
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
                forward.y = 0; forward.normalize();
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
                right.y = 0; right.normalize();
                
                const speedFactor = (delta / 1000) * this.data.speed;
                rig.position.addScaledVector(forward, -this.moveY * speedFactor);
                rig.position.addScaledVector(right, this.moveX * speedFactor);
            }
        });

        // 3. COLLIDER: PLATTFORM-BEGRENZUNG
        AFRAME.registerComponent('player-bounds', {
            init: function () {
                this.head = document.querySelector('#head').object3D;
                this.rig = this.el.object3D;
                this.worldPos = new THREE.Vector3();
            },
            tick: function () {
                if (!this.head) return;
                this.head.getWorldPosition(this.worldPos);
                const limit = 2.2;
                
                if (this.worldPos.x > limit) this.rig.position.x -= (this.worldPos.x - limit);
                else if (this.worldPos.x < -limit) this.rig.position.x += (-limit - this.worldPos.x);
                
                if (this.worldPos.z > limit) this.rig.position.z -= (this.worldPos.z - limit);
                else if (this.worldPos.z < -limit) this.rig.position.z += (-limit - this.worldPos.z);
                
                this.head.getWorldPosition(this.worldPos);
                const minPlatformDist = 0.55;
                const dist = Math.sqrt(this.worldPos.x * this.worldPos.x + this.worldPos.z * this.worldPos.z);
                if (dist < minPlatformDist && dist > 0.01) {
                    const push = (minPlatformDist - dist) / dist;
                    this.rig.position.x += this.worldPos.x * push;
                    this.rig.position.z += this.worldPos.z * push;
                }
            }
        });

        // 4. UI: ABGERUNDETE BUTTON-GEOMETRIE
        AFRAME.registerComponent('rounded-button', {
            schema: {
                width: {type: 'number', default: 0.35},
                height: {type: 'number', default: 0.11},
                radius: {type: 'number', default: 0.025},
                color: {type: 'color', default: '#111111'}
            },
            init: function () {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = this.data.color;
                ctx.beginPath();
                const scale = canvas.height / this.data.height;
                ctx.roundRect(0, 0, canvas.width, canvas.height, this.data.radius * scale);
                ctx.fill();
                
                this.el.setAttribute('geometry', { primitive: 'plane', width: this.data.width, height: this.data.height });
                const texture = new THREE.CanvasTexture(canvas);
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.material.map = texture;
                    mesh.material.transparent = true;
                    mesh.material.shader = 'flat';
                    mesh.material.needsUpdate = true;
                }
            }
        });

        // 5. NATIVES INTERAKTIONS- & ANIMATIONS-MANAGEMENT
        AFRAME.registerComponent('tour-control', {
            schema: { targetAngle: {type: 'number', default: 0} },
            init: function () {
                // HOVER FEEDBACK: Größer werden (Scale)
                this.el.setAttribute('animation__hoverScaleIn', {
                    property: 'scale', to: '1.08 1.08 1.08', dur: 150, easing: 'easeOutQuad', startEvents: 'mouseenter'
                });
                this.el.setAttribute('animation__hoverScaleOut', {
                    property: 'scale', to: '1 1 1', dur: 150, easing: 'easeOutQuad', startEvents: 'mouseleave'
                });

                // HOVER FEEDBACK: Dreidimensional abheben / nach oben erheben (Z-Achse)
                this.el.setAttribute('animation__hoverZIn', {
                    property: 'position.z', to: 0.04, dur: 150, easing: 'easeOutQuad', startEvents: 'mouseenter'
                });
                this.el.setAttribute('animation__hoverZOut', {
                    property: 'position.z', to: 0, dur: 150, easing: 'easeOutQuad', startEvents: 'mouseleave'
                });

                // KLICK-ANALYSE: Drückt sich kurz rein und federt unendlich oft sauber zurück (loop: 2)
                this.el.setAttribute('animation__clickPop', {
                    property: 'scale', from: '1.08 1.08 1.08', to: '0.94 0.94 0.94', dur: 80, dir: 'alternate', loop: 2, startEvents: 'click'
                });

                // Farbwechsel-Effekt im Canvas spiegeln
                this.el.addEventListener('mouseenter', () => { this.el.setAttribute('rounded-button', 'color', '#252525'); });
                this.el.addEventListener('mouseleave', () => { this.el.setAttribute('rounded-button', 'color', '#111111'); });

                // Drehung der Orangenschnitte am Horizont auslösen
                this.el.addEventListener('click', () => {
                    const highlight = document.querySelector('#tour-highlight');
                    highlight.setAttribute('animation', {
                        property: 'rotation',
                        to: `0 ${this.data.targetAngle} 0`,
                        dur: 1400,
                        easing: 'easeInOutCubic'
                    });
                });
            }
        });
    </script>
</head>
<body>

    <a-scene renderer="antialias: true; colorManagement: true; precision: mediump;">
        
        <a-assets>
            <img id="panorama" src="360.jpg">
            <audio id="ambient-wind" src="wind.mp3" preload="auto"></audio>
            <a-asset-item id="statue" src="statue.glb"></a-asset-item>
        </a-assets>

        <a-sound src="#ambient-wind" autoplay="true" loop="true" volume="0.5" positional="false"></a-sound>

        <a-sky src="#panorama" rotation="0 -90 0"></a-sky>

        <a-sphere id="tour-highlight" 
                  radius="95" 
                  material="shader: orange-slice-mask; angle: 35; feather: 4; opacity: 0.88; color: #020202; side: back; transparent: true; depthWrite: false;"
                  rotation="0 0 0">
        </a-sphere>

        <a-entity light="type: ambient; intensity: 0.7;"></a-entity>
        <a-entity light="type: directional; intensity: 0.6;" position="1 4 2"></a-entity>

        <a-box id="floor" position="0 -0.05 0" width="5" height="0.1" depth="5" color="#222" material="roughness: 0.85"></a-box>
        <a-box position="0 0.6 -2.5" width="5" height="1.2" depth="0.04" material="color: #a9d6e5; opacity: 0.25; transparent: true;"></a-box>
        <a-box position="0 0.6 2.5" width="5" height="1.2" depth="0.04" material="color: #a9d6e5; opacity: 0.25; transparent: true;"></a-box>
        <a-box position="-2.5 0.6 0" width="0.04" height="1.2" depth="5" material="color: #a9d6e5; opacity: 0.25; transparent: true;"></a-box>
        <a-box position="2.5 0.6 0" width="0.04" height="1.2" depth="5" material="color: #a9d6e5; opacity: 0.25; transparent: true;"></a-box>
        <a-box position="0 1.2 -2.5" width="5" height="0.04" depth="0.06" color="#111"></a-box>
        <a-box position="0 1.2 2.5" width="5" height="0.04" depth="0.06" color="#111"></a-box>
        <a-box position="-2.5 1.2 0" width="0.06" height="0.04" depth="5" color="#111"></a-box>
        <a-box position="2.5 1.2 0" width="0.06" height="0.04" depth="5" color="#111"></a-box>

        <a-cylinder id="podest" position="0 0.5 0" radius="0.23" height="1" color="#dddddd" material="roughness: 0.6"></a-cylinder>
        <a-gltf-model src="#statue" position="0 1.8 0"></a-gltf-model>

        <a-entity id="ui-floor-dashboard" position="0 0.02 0.75" rotation="-75 0 0">
            
            <a-entity class="clickable" tour-control="targetAngle: 0" rounded-button position="-0.4 0 0">
                <a-text value="SCHNITTE A" align="center" width="1.0" color="#FFF" font="kelsonsans" position="0 0 0.01"></a-text>
            </a-entity>

            <a-entity class="clickable" tour-control="targetAngle: -55" rounded-button position="0 0 0">
                <a-text value="SCHNITTE B" align="center" width="1.0" color="#FFF" font="kelsonsans" position="0 0 0.01"></a-text>
            </a-entity>

            <a-entity class="clickable" tour-control="targetAngle: 55" rounded-button position="0.4 0 0">
                <a-text value="SCHNITTE C" align="center" width="1.0" color="#FFF" font="kelsonsans" position="0 0 0.01"></a-text>
            </a-entity>

        </a-entity>

        <a-entity id="cameraRig" position="0 0 1.4" player-bounds>
            <a-camera id="head" look-controls wasd-controls="acceleration: 18;">
                <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
            </a-camera>
            <a-entity id="leftHand" oculus-touch-controls="hand: left" joystick-move></a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 6;" line="color: #4a90e2; opacity: 0.85"></a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
