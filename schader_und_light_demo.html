<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Plattform 10m - Dual Control Edition (Desktop WASD + VR Quest 2)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene>
        <a-assets>
            <canvas id="stars-texture" width="2048" height="1024"></canvas>
        </a-assets>

        <a-entity id="camera-rig" position="0 0 0" rotation="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls></a-entity>
            
            <a-entity id="left-controller" oculus-touch-controls="hand: left"></a-entity>
            <a-entity id="right-controller" oculus-touch-controls="hand: right"></a-entity>
        </a-entity>

        <a-entity id="platform" position="0 0 0">
            
            <a-circle color="#1a3a6c" radius="5.0" rotation="-90 0 0" side="double"></a-circle>

            <a-entity id="moving-segment-container" position="0 0.01 0" rotation="0 0 0">
                <a-circle id="neon-segment" color="#ccff00" radius="5.0" theta-start="0" theta-length="45" rotation="-90 0 0" material="shader: flat; transparent: true; opacity: 0.65" side="double"></a-circle>
                <a-circle color="#ccff00" radius="5.15" theta-start="-1" theta-length="47" rotation="-90 0 0" position="0 -0.001 0" material="shader: flat; transparent: true; opacity: 0.2" side="double"></a-circle>
            </a-entity>

            <a-ring color="#0a1526" radius-inner="2.98" radius-outer="3.02" rotation="-90 0 0" position="0 0.02 0"></a-ring>

            <a-entity position="2.2 0 2.2">
                <a-cylinder radius="0.3" height="0.8" position="0 0.4 0" color="#112233"></a-cylinder>
                <a-sphere position="0 1.1 0" radius="0.3" material="shader: standard; color: #ffffff; metalness: 0.95; roughness: 0.05"></a-sphere>
                <a-entity position="0 1.7 0" rotation="0 225 0">
                    <a-plane width="1.4" height="0.6" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="EXPONAT 1: CHROM-KUGEL\nShader: standard (PBR)\nMetalness: 0.95 | Roughness: 0.05\nSpiegelt die Lichtquellen." color="#ffffff" align="center" width="2.2" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="-2.2 0 2.2">
                <a-box width="0.6" height="0.8" depth="0.6" position="0 0.4 0" color="#112233"></a-box>
                <a-torus position="0 1.1 0" radius="0.2" radius-tubular="0.05" rotation="0 45 0" material="shader: flat; color: #ff00ff"></a-torus>
                <a-entity position="0 1.7 0" rotation="0 135 0">
                    <a-plane width="1.4" height="0.6" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="EXPONAT 2: NEON-RING\nShader: flat\nIgnoriert Raumlicht & Schatten.\nKonstante, pure Farbausgabe." color="#ffffff" align="center" width="2.2" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="-2.2 0 -2.2">
                <a-cylinder radius="0.3" height="0.8" position="0 0.4 0" color="#112233"></a-cylinder>
                <a-cone position="0 1.1 0" radius-bottom="0.25" height="0.5" material="shader: standard; color: #ff9900; roughness: 0.95; metalness: 0.0"></a-cone>
                <a-entity position="0 1.7 0" rotation="0 45 0">
                    <a-plane width="1.4" height="0.6" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="EXPONAT 3: MATTER KEGEL\nShader: standard\nRoughness: 0.95 | Metalness: 0.0\nSchluckt Licht, weiche Verlaeufe." color="#ffffff" align="center" width="2.2" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="2.2 0 -2.2">
                <a-box width="0.6" height="0.8" depth="0.6" position="0 0.4 0" color="#112233"></a-box>
                <a-box position="0 1.1 0" width="0.4" height="0.4" depth="0.4" rotation="0 30 0" material="shader: standard; color: #00ffff; transparent: true; opacity: 0.4; roughness: 0.1; metalness: 0.2"></a-box>
                <a-entity position="0 1.7 0" rotation="0 -45 0">
                    <a-plane width="1.4" height="0.6" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="EXPONAT 4: GLAS-WUERFEL\nShader: standard\nTransparent: true | Opacity: 0.4\nLichtdurchlaessiges Alpha-Blending." color="#ffffff" align="center" width="2.2" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="3.1 0 0">
                <a-cylinder radius="0.04" height="1.4" position="0 0.7 0" color="#223344"></a-cylinder>
                <a-sphere radius="0.1" position="0 1.4 0" color="#00ffff" material="shader: flat"></a-sphere>
                <a-entity light="type: point; color: #00ffff; intensity: 2.0; distance: 4.0" position="0 1.4 0"></a-entity>
                <a-entity position="0 1.9 0" rotation="0 -90 0">
                    <a-plane width="1.4" height="0.5" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="LICHT: POINT LIGHT\nFarbe: Cyan | Intensitaet: 2.0\nStrahlt gleichmaessig in alle\nRichtungen ab (Kugelradius)." color="#ffffff" align="center" width="2.0" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="0 0 3.1">
                <a-cylinder radius="0.04" height="1.6" position="0 0.8 0" color="#223344"></a-cylinder>
                <a-cylinder radius="0.08" height="0.2" position="0 1.6 -0.1" rotation="45 0 0" color="#111111"></a-cylinder>
                <a-entity light="type: spot; color: #ff0000; intensity: 4.0; angle: 40; penumbra: 0.5; distance: 3.5" position="0 1.6 -0.1" rotation="-45 0 0"></a-entity>
                <a-entity position="0 2.1 0" rotation="0 180 0">
                    <a-plane width="1.4" height="0.5" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="LICHT: SPOT LIGHT\nFarbe: Rot | Kegelwinkel: 40 deg\nZielgerichteter Lichtkegel nach\nunten mit weichem Rand." color="#ffffff" align="center" width="2.0" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="-3.1 0 0">
                <a-cylinder radius="0.04" height="1.4" position="0 0.7 0" color="#223344"></a-cylinder>
                <a-box width="0.15" height="0.15" depth="0.15" position="0 1.4 0" color="#ffaa00" material="shader: flat"></a-box>
                <a-entity light="type: point; color: #ffaa00; intensity: 5.0; distance: 2.5; decay: 2" position="0 1.4 0"></a-entity>
                <a-entity position="0 1.9 0" rotation="0 90 0">
                    <a-plane width="1.4" height="0.5" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="LICHT: POINT + DECAY\nFarbe: Amber | Decay-Faktor: 2\nSehr hell im Zentrum, verblasst\njedoch extrem schnell." color="#ffffff" align="center" width="2.0" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-entity position="0 0 -3.1">
                <a-cylinder radius="0.04" height="1.4" position="0 0.7 0" color="#223344"></a-cylinder>
                <a-sphere radius="0.1" position="0 1.4 0" color="#00ff00" material="shader: flat" animation="property: material.opacity; from: 0.2; to: 1.0; dir: alternate; loop: true; dur: 800"></a-sphere>
                <a-entity light="type: point; color: #00ff00; distance: 4.0" position="0 1.4 0" animation="property: light.intensity; from: 0.2; to: 3.0; dir: alternate; loop: true; dur: 800"></a-entity>
                <a-entity position="0 1.9 0" rotation="0 0 0">
                    <a-plane width="1.4" height="0.5" color="#0a1526" opacity="0.9"></a-plane>
                    <a-text value="LICHT: ANIMATED BEACON\nFarbe: Gruen | Intervall: 800ms\nIntensitaet schwillt ueber native\nA-Frame Animationen an/ab." color="#ffffff" align="center" width="2.0" position="0 0 0.01"></a-text>
                </a-entity>
            </a-entity>

            <a-cylinder radius="5.0" height="1.2" position="0 0.6 0" material="color: #8daed6; opacity: 0.25; transparent: true; side: double; roughness: 0.1; metalness: 0.3" open-ended="true"></a-cylinder>
            <a-cylinder position="5.0 0.6 0" radius="0.03" height="1.2" color="#0a1526"></a-cylinder>
            <a-cylinder position="-5.0 0.6 0" radius="0.03" height="1.2" color="#0a1526"></a-cylinder>
            <a-cylinder position="0 0.6 5.0" radius="0.03" height="1.2" color="#0a1526"></a-cylinder>
            <a-cylinder position="0 0.6 -5.0" radius="0.03" height="1.2" color="#0a1526"></a-cylinder>
        </a-entity>

        <a-sky color="#000000"></a-sky>
        <a-sky id="space-sky" src="#stars-texture" material="transparent: true; opacity: 1" radius="495"></a-sky>
        <a-light id="ambient-light" type="ambient" color="#ffffff" intensity="0.3"></a-light>
        <a-light id="directional-light" type="directional" color="#ffffff" intensity="0.4" position="4 6 -2"></a-light>
    </a-scene>

    <script>
        const segmentContainer = document.getElementById('moving-segment-container');
        const sky = document.getElementById('space-sky');
        const ambientLight = document.getElementById('ambient-light');
        const directionalLight = document.getElementById('directional-light');
        let currentRotationY = 0;
        const angleStep = -45; 
        const fadeDuration = 1200; 

        function animateValue(start, end, duration, onUpdate, onComplete) {
            let startTime = null;
            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = Math.min((timestamp - startTime) / duration, 1);
                let currentValue = start + (end - start) * progress;
                onUpdate(currentValue);
                if (progress < 1) { window.requestAnimationFrame(step); } else if (onComplete) { onComplete(); }
            }
            window.requestAnimationFrame(step);
        }

        setInterval(() => {
            animateValue(1, 0, fadeDuration, (factor) => {
                sky.setAttribute('material', `transparent: true; opacity: ${factor}`);
                ambientLight.setAttribute('intensity', factor * 0.3);
                directionalLight.setAttribute('intensity', factor * 0.4);
            }, () => {
                currentRotationY += angleStep;
                segmentContainer.setAttribute('rotation', `0 ${currentRotationY} 0`);
                animateValue(0, 1, fadeDuration, (factor) => {
                    sky.setAttribute('material', `transparent: true; opacity: ${factor}`);
                    ambientLight.setAttribute('intensity', factor * 0.3);
                    directionalLight.setAttribute('intensity', factor * 0.4);
                });
            });
        }, 5000);
    </script>

    <script>
        (function() {
            const canvas = document.getElementById('stars-texture');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 800; i++) {
                let x = Math.random() * canvas.width; let y = Math.random() * canvas.height; let radius = Math.random() * 1.5;
                let colors = ['#ffffff', '#ffffff', '#e0f0ff', '#fff5d1'];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.beginPath(); ctx.arc(x, y, radius, 0, 2 * Math.PI); ctx.fill();
            }
        })();
    </script>

    <script>
        const rig = document.getElementById('camera-rig');
        const camera = document.querySelector('[camera]');
        const leftController = document.getElementById('left-controller');
        const rightController = document.getElementById('right-controller');
        
        // Speicher für Desktop-Tastatur
        const keys = { w: false, a: false, s: false, d: false };
        const speed = 0.12;

        // Speicher für VR-Joysticks
        let vrMoveX = 0;
        let vrMoveZ = 0;
        let canSnapTurn = true;

        // ================= DESKTOP-ABFRAGE (TASTATUR) =================
        window.addEventListener('keydown', (e) => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false; 
        });

        // ================= VR-ABFRAGE (QUEST JOYSTICKS) =================
        // Linker Stick: Flüssige Bewegung vorbereiten
        leftController.addEventListener('thumbstickmoved', (e) => {
            vrMoveX = e.detail.x; 
            vrMoveZ = e.detail.y; 
        });

        // Rechter Stick: Snap-Rotation ausführen
        rightController.addEventListener('thumbstickmoved', (e) => {
            let stickX = e.detail.x;
            if (!canSnapTurn) {
                if (Math.abs(stickX) < 0.2) canSnapTurn = true; // Stick wieder in Nullstellung gebracht
                return;
            }
            if (stickX > 0.7) { // Klick nach rechts
                let currentRot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
                rig.setAttribute('rotation', { x: currentRot.x, y: currentRot.y - 45, z: currentRot.z });
                canSnapTurn = false;
            } else if (stickX < -0.7) { // Klick nach links
                let currentRot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
                rig.setAttribute('rotation', { x: currentRot.x, y: currentRot.y + 45, z: currentRot.z });
                canSnapTurn = false;
            }
        });

        // ================= RECHNERISCHE ZUSAMMENFÜHRUNG BEIDER SYSTEME =================
        setInterval(() => {
            let pos = rig.getAttribute('position');
            let rigRot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
            let camRot = camera.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
            
            // Blickwinkel kombinieren (wichtig für Desktop-Mausblick UND VR-Headsetrichtung)
            let totalAngle = (rigRot.y + camRot.y) * Math.PI / 180;
            let moveX = 0; let moveZ = 0;

            // SYSTEM A: Tastatur-Berechnung (Desktop)
            if (keys.w) { moveX -= Math.sin(totalAngle); moveZ -= Math.cos(totalAngle); }
            if (keys.s) { moveX += Math.sin(totalAngle); moveZ += Math.cos(totalAngle); }
            if (keys.a) { moveX -= Math.cos(totalAngle); moveZ += Math.sin(totalAngle); }
            if (keys.d) { moveX += Math.cos(totalAngle); moveZ -= Math.sin(totalAngle); }

            // SYSTEM B: VR-Joystick-Berechnung (Quest)
            if (Math.abs(vrMoveX) > 0.1 || Math.abs(vrMoveZ) > 0.1) {
                moveX += vrMoveZ * Math.sin(totalAngle);
                moveZ += vrMoveZ * Math.cos(totalAngle);
                moveX += vrMoveX * Math.cos(totalAngle);
                moveZ -= vrMoveX * Math.sin(totalAngle);
            }

            // Finale Positionsberechnung mit Plattformbegrenzung (Collider)
            let nextX = pos.x + moveX * speed;
            let nextZ = pos.z + moveZ * speed;
            let distance = Math.sqrt(nextX * nextX + nextZ * nextZ);

            if (distance < 4.9) {
                rig.setAttribute('position', { x: nextX, y: pos.y, z: nextZ });
            } else {
                let edgeAngle = Math.atan2(nextZ, nextX);
                rig.setAttribute('position', { x: Math.cos(edgeAngle) * 4.89, y: pos.y, z: Math.sin(edgeAngle) * 4.89 });
            }
        }, 16);
    </script>

</body>
</html>
