<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Dunkler Raum mit Rundum-Spotlights und Quest 2 Steuerung</title>
    <!-- A-Frame Hauptbibliothek -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Extra-Komponente für die VR-Controller-Bewegung (Thumbstick-Navigation) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>

    <!-- Szene mit deaktiviertem Standardlicht und sehr dunklem Hintergrund -->
    <a-scene light="defaultLightsEnabled: false" background="color: #030303">
      
      <!-- Asset Management für das 3D-Modell -->
      <a-assets>
        <a-asset-item id="frau-modell" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- 1. BELEUCHTUNG (Spotlights von allen 4 Seiten) -->
      
      <!-- Minimales Grundlicht, damit Schatten nicht komplett absaufen -->
      <a-light type="ambient" color="#111" intensity="0.1"></a-light>

      <!-- Spotlight NORD (Leuchtet von vorne-oben Richtung Mitte) -->
      <a-light type="spot" position="0 3.5 2" rotation="-45 0 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="true" color="#fff"></a-light>

      <!-- Spotlight SÜD (Leuchtet von hinten-oben Richtung Mitte) -->
      <a-light type="spot" position="0 3.5 -2" rotation="-45 180 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="true" color="#fff"></a-light>

      <!-- Spotlight OST (Leuchtet von rechts-oben Richtung Mitte) -->
      <a-light type="spot" position="2 3.5 0" rotation="-45 90 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="true" color="#fff"></a-light>

      <!-- Spotlight WEST (Leuchtet von links-oben Richtung Mitte) -->
      <a-light type="spot" position="-2 3.5 0" rotation="-45 -90 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="true" color="#fff"></a-light>


      <!-- 2. RAUM & BODEN -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#0a0a0a" roughness="0.9" shadow="receive: true"></a-plane>


      <!-- 3. PODEST (Durchmesser 1m, Höhe 1m) -->
      <a-cylinder id="podest" position="0 0.5 0" radius="0.5" height="1" color="#1a1a1a" roughness="0.6" shadow="cast: true; receive: true"></a-cylinder>


      <!-- 4. GLB-MODELL (Die Frau steht auf dem Podest) -->
      <a-entity gltf-model="#frau-modell" position="0 1.0 0" scale="1 1 1" shadow="cast: true; receive: true"></a-entity>


      <!-- 5. KAMERA, WASD & QUEST 2 CONTROLLER-STEUERUNG -->
      <!-- Das "movement-controls"-Attribut ermöglicht die Bewegung per WASD UND VR-Controller-Stick -->
      <a-entity id="rig" movement-controls="controls: keyboard, touch, gamepad; speed: 0.15" position="0 0 3">
        
        <!-- Die Brille/Kamera des Nutzers -->
        <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true"></a-entity>
        
        <!-- Linker Quest-Controller: Steuert die Bewegung im Raum über den Analogstick -->
        <a-entity laser-controls="hand: left" vive-controls="hand: left" oculus-touch-controls="hand: left"></a-entity>
        
        <!-- Rechter Quest-Controller: Für eventuelle spätere Interaktionen (zeigt einen Strahl) -->
        <a-entity laser-controls="hand: right" vive-controls="hand: right" oculus-touch-controls="hand: right"></a-entity>
        
      </a-entity>

    </a-scene>

  </body>
</html>
