<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Quest 2 Fix</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-entity id="rig" movement-controls="controls: keyboard, gamepad; speed: 0.15">
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <a-entity oculus-touch-controls="hand: right" snap-turn></a-entity>
      </a-entity>

      <a-gltf-model 
        src="#myModel" 
        position="-3.042 0.000 -1.009" 
        rotation="0.000 0.000 0.000" 
        scale="20.000 20.000 20.000">
      </a-gltf-model>
      
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
      AFRAME.registerComponent('snap-turn', {
        init: function () {
          this.el.addEventListener('axismove', (evt) => {
            // Rechter Stick: Achse 2 ist horizontal (links/rechts)
            let joystickX = evt.detail.axis[2]; 
            let rig = document.querySelector('#rig');
            
            if (!this.turned && Math.abs(joystickX) > 0.7) {
              let rotation = rig.getAttribute('rotation') || {x: 0, y: 0, z: 0};
              // Drehe um 45 Grad nach links oder rechts
              rotation.y += joystickX > 0 ? -45 : 45;
              rig.setAttribute('rotation', rotation);
              this.turned = true; // Sperre, damit es nicht durchrast
            }
            
            // Stick wieder in der Mitte? Dann zurücksetzen
            if (Math.abs(joystickX) < 0.2) {
              this.turned = false;
            }
          });
        }
      });
    </script>
  </body>
</html>
