<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <title>Dunkler Raum mit 4-Seiten-Spotlights (Soft AA)</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>

    <a-scene light="defaultLightsEnabled: false" 
             background="color: #030303" 
             renderer="antialias: true; 
                       precision: highp; 
                       colorManagement: true; 
                       highRefreshRate: true;
                       powerPreference: high-performance;">
      
      <a-assets>
        <a-asset-item id="frau-modell" src="model.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#111" intensity="0.1"></a-light>
      <a-light type="spot" position="0 3.5 2" rotation="-45 0 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="false" color="#fff"></a-light>
      <a-light type="spot" position="0 3.5 -2" rotation="-45 180 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="false" color="#fff"></a-light>
      <a-light type="spot" position="2 3.5 0" rotation="-45 90 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="false" color="#fff"></a-light>
      <a-light type="spot" position="-2 3.5 0" rotation="-45 -90 0" intensity="1.5" angle="35" penumbra="0.6" castShadow="false" color="#fff"></a-light>

      <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#0a0a0a" roughness="0.9"></a-plane>
      <a-cylinder id="podest" position="0 0.5 0" radius="0.5" height="1" color="#1a1a1a" roughness="0.6"></a-cylinder>

      <a-entity gltf-model="#frau-modell" position="0 1.0 0" scale="1 1 1" shadow="cast: false; receive: false"></a-entity>

      <a-entity id="rig" movement-controls="controls: keyboard, touch, gamepad; speed: 0.15" position="0 0 3">
        
        <a-entity camera 
                  position="0 1.6 0" 
                  look-controls="pointerLockEnabled: true" 
                  webxr="foveatedRendering: false">
          
          <a-entity light="type: ambient; intensity: 0.05;" class="soft-bloom-overlay"></a-entity>
          
        </a-entity>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>
        
      </a-entity>

    </a-scene>

  </body>
</html>
