<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame mit Quest 2 Steuerung</title>
    <!-- A-Frame Basis-Bibliothek -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- A-Frame Extras für die Bewegungskomponenten (WASD + Controller) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- Das Rig umschließt die Kamera und die Controller -->
      <a-entity id="rig" movement-controls="controls: gamepad, keyboard; speed: 0.15;">
        <!-- Kamera für PC (WASD + Maus) und VR-Headset -->
        <a-entity camera position="0 1.6 0" look-controls></a-entity>

        <!-- Linker Controller: Steuert das Laufen über den analogen Stick -->
        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <!-- Rechter Controller: Aktiviert das ruckartige Drehen (Snap Turn) -->
        <a-entity oculus-touch-controls="hand: right" snap-turn-controls="reference: #rig; turnAngle: 45"></a-entity>
      </a-entity>

      <!-- Dein 3D-Modell in der Mitte -->
      <a-gltf-model src="#myModel" position="0 1.6 -3" scale="1 1 1"></a-gltf-model>

      <!-- Hintergrundfarbe -->
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
