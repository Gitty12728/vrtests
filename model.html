<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame: Plattform, Modell & Quest 2 Flug-Steuerung</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-entity id="rig" position="0 1.6 0" movement-controls="controls: keyboard, gamepad; speed: 0.15; fly: true">
        
        <a-entity camera look-controls="pointerLockEnabled: true"></a-entity>

        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <a-entity oculus-touch-controls="hand: right" snap-turn></a-entity>
        
      </a-entity>

      <a-cylinder 
        position="0 0.0005 0" 
        radius="2.5" 
        height="0.001" 
        color="#7BC8A4">
      </a-cylinder>

      <a-cylinder 
        position="0 1 0" 
        radius="2.5" 
        height="2" 
        open-ended="true"
        side="double"
        material="visible: false">
      </a-cylinder>

      <a-gltf-model 
        src="#myModel" 
        position="-3.042 0.001 -1.009" 
        rotation="0.000 0.000 0.000" 
        scale="20.000 20.000 20.000">
      </a-gltf-model>
      
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
      AFRAME.registerComponent('snap-turn', {
        init: function () {
          // Wir lauschen auf Achsenbewegungen des Controllers
          this.el.addEventListener('axismove', (evt) => {
            // axis[2] ist bei der Quest 2 der horizontale Wert (links/rechts) des RECHTEN Daumensticks
            let joystickX = evt.detail.axis[2]; 
            let rig = document.querySelector('#rig');
            
            // Wenn der Stick stark nach links oder rechts gedrückt wird (> 0.7) und die Sperre nicht aktiv ist
            if (!this.turned && Math.abs(joystickX) > 0.7) {
              let rotation = rig.getAttribute('rotation') || {x: 0, y: 0, z: 0};
              
              // Stick nach rechts -> drehe -45 Grad. Stick nach links -> drehe +45 Grad.
              rotation.y += joystickX > 0 ? -45 : 45;
              rig.setAttribute('rotation', rotation);
              
              // Sperre aktivieren, damit es bei gehaltenem Stick nicht unendlich schnell dreht
              this.turned = true; 
            }
            
            // Erst wenn der Stick wieder fast in der Mitte ist (< 0.2), wird die Sperre aufgehoben
            if (Math.abs(joystickX) < 0.2) {
              this.turned = false;
            }
          });
        }
      });
    </script>
  </body>
</html>
