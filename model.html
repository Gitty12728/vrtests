<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame mit Modell</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="myModel" src="model.glb"></a-asset-item>
      </a-assets>

      <a-gltf-model src="#myModel" position="0 1.6 -3" scale="1 1 1"></a-gltf-model>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
