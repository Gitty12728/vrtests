<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echter AR-Boden-Kubus</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: white; z-index: 9999; background: #111;
      }
      .btn {
        background: #2ecc71; color: white; border: none; padding: 15px 30px;
        font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="start-screen">
      <h2>Kubus-Test bereit</h2>
      <button id="aktivieren-btn" class="btn">AR & Kamera starten</button>
    </div>

    <div id="ar-container"></div>

    <script>
      document.getElementById('aktivieren-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';

        const container = document.getElementById('ar-container');
        
        // HIER STEHT JETZT DAS ECHTE KAMERA-SYSTEM (sourceType: webcam)
        container.innerHTML = `
          <a-scene 
            embedded 
            arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; detectionMode: mono_matrix;"
            vr-mode-ui="enabled: false">
            
            <a-box 
              position="0 -1 -3" 
              rotation="0 45 0" 
              width="1" height="1" depth="1"
              material="color: #ff3366; roughness: 0.2;"
              animation="property: rotation; to: 0 405 0; loop: true; dur: 4000; easing: linear">
            </a-box>

            <a-camera look-controls-allowed="true" arjs-look-controls></a-camera>

          </a-scene>
        `;
      });
    </script>
  </body>
</html>
