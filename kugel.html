<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Perfekt platzierter AR-Kubus</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
      #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: white; z-index: 9999; background: #111;
      }
      .btn {
        background: #3498db; color: white; border: none; padding: 15px 30px;
        font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="start-screen">
      <h2>AR-Station bereit</h2>
      <button id="aktivieren-btn" class="btn">Kamera starten</button>
    </div>

    <div id="ar-container"></div>

    <script>
      // Eigene kleine Komponente, die den Würfel beim Start einmalig auf den Boden setzt
      AFRAME.registerComponent('snap-to-floor', {
        init: function () {
          // Wir warten einen winzigen Moment, bis die Kamera sich stabilisiert hat
          setTimeout(() => {
            // Wir holen die aktuelle Welt-Position direkt vor der Kamera
            const position = new THREE.Vector3();
            this.el.object3D.getWorldPosition(position);
            
            // Wir lösen den Würfel aus der Kamera-Verankerung, damit er im Raum stehen bleibt
            this.el.sceneEl.appendChild(this.el);
            
            // Wir zwingen ihn auf den Boden (-1.2 Meter unter Augenhöhe) und genau vor dich
            this.el.setAttribute('position', { x: position.x, y: -1.2, z: position.z });
          }, 500);
        }
      });

      document.getElementById('aktivieren-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        const container = document.getElementById('ar-container');
        
        container.innerHTML = `
          <a-scene 
            embedded 
            arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
            vr-mode-ui="enabled: false">
            
            <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
            <a-entity light="type: directional; color: #ffffff; intensity: 0.6" position="1 3 1"></a-entity>

            <a-camera look-controls="enabled: true">
              
              <a-box 
                snap-to-floor
                position="0 0 -1.5" 
                rotation="0 45 0" 
                width="0.2" height="0.2" depth="0.2"
                material="color: #ff3366; roughness: 0.1; metalness: 0.1;"
                animation="property: rotation; to: 0 405 0; loop: true; dur: 4000; easing: linear">
              </a-box>

            </a-camera>

          </a-scene>
        `;
      });
    </script>
  </body>
</html>
