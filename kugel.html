<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garantierte AR Bodensuche</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
      body { margin: 0; background-color: #111; font-family: sans-serif; }
      
      /* Der Viewer füllt den Bildschirm, verbraucht aber erst Akku, wenn AR startet */
      model-viewer {
        width: 100vw;
        height: 100vh;
      }

      /* Ein schicker, nativer Button zum Aktivieren vor Ort */
      #ar-button {
        background-color: #2ecc71;
        background-image: url(https://modelviewer.dev/assets/ic_ar_loose_from_placement_24dp.svg);
        background-repeat: no-repeat;
        background-position: 12px 50%;
        background-size: 24px 24px;
        color: #fff;
        font-weight: bold;
        font-size: 16px;
        border-radius: 30px;
        padding: 12px 20px 12px 45px;
        border: none;
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="none"
      shadow-intensity="1">
      
      <button slot="ar-button" id="ar-button">
        In den Raum stellen
      </button>
      
    </model-viewer>

  </body>
</html>
