<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPS Schnitzeljagd mit Model-Viewer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
      
      /* 2D-Navigations-Bildschirm (Akkuschonend beim Laufen) */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #1a1a1a; color: white; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 20px; box-sizing: border-box;
      }
      .btn {
        background: #27ae60; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 30px; cursor: pointer; margin-top: 20px; font-weight: bold;
      }

      /* Das 3D/AR Fenster (Füllt den Bildschirm erst bei Ankunft) */
      model-viewer {
        width: 100vw; height: 100vh; display: none;
      }

      /* Native AR-Aktivierungstaste von Google */
      #ar-button {
        background-color: #e67e22; color: white; font-weight: bold; font-size: 16px;
        border-radius: 30px; padding: 12px 25px; border: none; position: absolute;
        bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      }

      /* Schwebende Audiosteuerung über dem AR-Bildschirm */
      #audio-controls {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        z-index: 1000; display: none; background: rgba(0, 0, 0, 0.85);
        padding: 12px 25px; border-radius: 30px; gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      .control-btn {
        background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; min-width: 90px;
      }
    </style>
  </head>
  <body>

    <audio id="erzaehlung" src="deine-erzaehlung.mp3" preload="auto"></audio>

    <div id="overlay">
      <h2>Station 1: Die Suche läuft</h2>
      <p id="status-text">Bitte klicke auf Start, um das GPS-Tracking zu aktivieren...</p>
      <button id="start-btn" class="btn">Schnitzeljagd starten</button>
    </div>

    <model-viewer 
      id="viewer"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      touch-action="none"
      shadow-intensity="1">
      
      <button slot="ar-button" id="ar-button">
        📸 In den Raum stellen (Boden scannen)
      </button>
      
    </model-viewer>

    <div id="audio-controls">
      <button id="pause-btn" class="control-btn">⏸ Pause</button>
      <button id="play-btn" class="control-btn" style="display: none;">▶ Play</button>
    </div>

    <script>
      // HIER DEINE ECHTEN KOORDINATEN EINTRAGEN
      const targetLat = 48.137154;
      const targetLon = 11.575449;
      const triggerRadiusMeter = 15; // Radius in Metern für die Ankunft

      const overlay = document.getElementById('overlay');
      const statusText = document.getElementById('status-text');
      const startBtn = document.getElementById('start-btn');
      const viewer = document.getElementById('viewer');
      const audio = document.getElementById('erzaehlung');
      const controlsDiv = document.getElementById('audio-controls');
      const playBtn = document.getElementById('play-btn');
      const pauseBtn = document.getElementById('pause-btn');
      
      let watchId = null;

      // Die mathematische Formel zur präzisen GPS-Abstands-Berechnung
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      }

      // Start-Klick des Nutzers schaltet das Live-GPS scharf
      startBtn.addEventListener('click', () => {
        startBtn.style.display = "none";
        statusText.innerText = "Suche läuft... Laufe jetzt zum Zielort.";

        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition((position) => {
            const distance = getDistance(position.coords.latitude, position.coords.longitude, targetLat, targetLon);

            if (distance <= triggerRadiusMeter) {
              // ZIEL ERREICHT!
              navigator.geolocation.clearWatch(watchId); // GPS abschalten um Akku komplett zu schonen
              activateARAndAudio();
            } else {
              statusText.innerText = `Du bist noch ${Math.round(distance)} Meter entfernt.`;
            }
          }, (error) => {
            statusText.innerText = "GPS-Fehler: " + error.message;
          }, { enableHighAccuracy: true });
        }
      });

      // Wechselt vollautomatisch bei Ankunft in die AR-Welt
      function activateARAndAudio() {
        overlay.style.display = 'none';      // Schaltet die Navigation aus
        viewer.style.display = 'block';       // Schaltet das Model-Viewer 3D-Fenster an
        controlsDiv.style.display = 'flex';   // Zeigt die Play/Pause Buttons
        
        audio.play(); // Startet sofort den Erzähltext
      }

      // --- PLAY / PAUSE BUTTON STEUERUNG ---
      pauseBtn.addEventListener('click', () => {
        audio.pause();
        pauseBtn.style.display = 'none';
        playBtn.style.display = 'inline-block';
      });

      playBtn.addEventListener('click', () => {
        audio.play();
        playBtn.style.display = 'none';
        pauseBtn.style.display = 'inline-block';
      });
    </script>
  </body>
</html>
