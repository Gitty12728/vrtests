<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR & PC Combo Playground</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

    <script>
      // Das unzerstörbare Flug-Skript für die Kugeln
      AFRAME.registerComponent('ballistik-kugel', {
        init: function () {
          if (!this.el.customVelocity) {
            this.el.customVelocity = new THREE.Vector3(0, 0, -20);
          }
          this.gravity = -18; 
        },
        tick: function (time, timeDelta) {
          var dt = timeDelta / 1000;
          if (dt === 0 || isNaN(dt)) return;

          var pos = this.el.getAttribute('position');
          this.el.customVelocity.y += this.gravity * dt;

          pos.x += this.el.customVelocity.x * dt;
          pos.y += this.el.customVelocity.y * dt;
          pos.z += this.el.customVelocity.z * dt;

          this.el.setAttribute('position', pos);

          if (pos.y <= 0.1) {
            pos.y = 0.1;
            this.el.setAttribute('position', pos);
            this.el.removeAttribute('ballistik-kugel'); 
          }
        }
      });

      // UNIVERSAL SCHUSS-SYSTEM (Funktioniert über VR-Trigger UND PC-Mausklick)
      AFRAME.registerComponent('universal-shooter', {
        init: function () {
          // Funktion, die den Schuss tatsächlich ausführt
          this.fire = () => {
            var scene = this.el.sceneEl;
            var kugel = document.createElement('a-sphere');
            
            // Position und Richtung ermitteln (egal ob Hand-Controller oder PC-Kamera)
            var currentMatrix = this.el.object3D.matrixWorld;
            var startPos = new THREE.Vector3();
            startPos.setFromMatrixPosition(currentMatrix);
            
            var richtung = new THREE.Vector3(0, 0, -1);
            richtung.applyQuaternion(this.el.object3D.quaternion);
            
            // Kugel leicht vor dem Ursprung platzieren
            kugel.setAttribute('position', {
              x: startPos.x + richtung.x * 0.5,
              y: startPos.y + richtung.y * 0.5,
              z: startPos.z + richtung.z * 0.5
            });
            
            kugel.setAttribute('radius', '0.15');
            kugel.setAttribute('color', '#FF0000');
            
            // Speed einspritzen
            var power = 35; 
            kugel.customVelocity = new THREE.Vector3(
              richtung.x * power,
              richtung.y * power,
              richtung.z * power
            );
            
            kugel.setAttribute('ballistik-kugel', '');
            scene.appendChild(kugel);

            setTimeout(() => {
              if (kugel.parentNode) kugel.parentNode.removeChild(kugel);
            }, 5000);
          };

          // Event 1: Wenn es sich um einen VR-Controller handelt (Trigger gedrückt)
          this.el.addEventListener('triggerdown', this.fire);

          // Event 2: Wenn es sich um die PC-Kamera handelt (Maus geklickt)
          if (this.el.id === 'head') {
            window.addEventListener('click', (e) => {
              // Nur schießen, wenn wir NICHT im VR-Modus sind (verhindert Doppelschüsse)
              if (!this.el.sceneEl.is('vr-mode')) {
                this.fire();
              }
            });
          }
        }
      });
    </script>
  </head>
  <body>
    
    <a-scene>
      <a-assets>
        <img id="gras" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
      </a-assets>

      <a-entity id="cameraRig" movement-controls="controls: gamepad, keyboard; speed: 0.15">
        
        <a-camera id="head" look-controls universal-shooter position="0 1.6 0">
          <a-entity cursor="rayOrigin: entity" raycaster="objects: .ziel; far: 15"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                    material="color: #FFF; shader: flat; opacity: 0.5"
                    visible="true">
          </a-entity>
        </a-camera>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <a-entity oculus-touch-controls="hand: right" universal-shooter
                  raycaster="objects: .ziel; far: 15; showLine: true; lineColor: #FFFFFF; lineOpacity: 0.8"
                  cursor="rayOrigin: entity">
          
          <a-box position="0 0 -0.15" width="0.04" height="0.04" depth="0.25" color="#212121"></a-box>
          
          <a-entity snap-turn-controls="reference: #cameraRig; turnAngle: 45"></a-entity>
        </a-entity>
      </a-entity>

      <a-plane id="ground" src="#gras" rotation="-90 0 0" width="100" height="100" repeat="50 50"></a-plane>
      <a-sky color="#0a0a20"></a-sky>
      <a-ambient-light intensity="0.7"></a-ambient-light>

      <a-box class="ziel" position="0 1.5 -7" width="1.5" height="3" depth="1.5" color="#00BCD4"></a-box>
      <a-box class="ziel" position="-3 1 -5" width="1" height="2" depth="1" color="#E91E63"></a-box>
      <a-box class="ziel" position="3 1 -5" width="1" height="2" depth="1" color="#4CAF50"></a-box>

    </a-scene>
  </body>
</html>
