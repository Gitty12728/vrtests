<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR New Playground - Ultimate Physics & Fixed Controls</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

    <script>
      // 1. Farbanpassung für interaktive Säulen
      AFRAME.registerComponent('color-changer', {
        init: function () {
          this.el.addEventListener('click', () => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            this.el.setAttribute('material', 'color', randomColor);
          });
        }
      });

      // 2. Schwerkraft-Inverter für die schwebende Kugel
      AFRAME.registerComponent('gravity-kick', {
        init: function () {
          this.el.addEventListener('click', () => {
            // Verpasst dem Objekt einen physikalischen Stoß nach oben
            this.el.body.applyImpulse(
              {x: 0, y: 15, z: 0}, // Kraft nach oben
              {x: 0, y: 0, z: 0}   // Ursprungspunkt des Stoßes
            );
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene physx="autoLoad: true; delay: 1000; wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/lib/physx.release.wasm">
      
      <a-assets>
        <img id="sand" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
      </a-assets>

      <a-entity id="cameraRig">
        <a-camera id="head" look-controls position="0 1.6 0"></a-camera>
        
        <a-entity oculus-touch-controls="hand: left"
                  blink-controls="cameraRig: #cameraRig; 
                                  teleportOrigin: #head; 
                                  collisionEntities: #ground; 
                                  button: thumbstick; 
                                  curveStyle: curved; 
                                  snapTurn: true; 
                                  turnAngle: 45">
        </a-entity>

        <a-entity laser-controls="hand: right"
                  raycaster="objects: .klickbar; far: 20; lineColor: #FFFFFF; lineOpacity: 1"
                  cursor="rayOrigin: entity">
        </a-entity>
      </a-entity>

      <a-plane id="ground" src="#sand" rotation="-90 0 0" width="100" height="100" repeat="30 30" physx-body="type: static"></a-plane>
      
      <a-sky color="#050510"></a-sky> 
      <a-ambient-light type="ambient" color="#999"></a-ambient-light>
      <a-directional-light type="directional" position="-1 5 -2" intensity="0.7"></a-directional-light>

      <a-cylinder class="klickbar" color-changer position="-3 1.5 -4" radius="0.4" height="3" color="#4CC3D9"></a-cylinder>
      <a-cylinder class="klickbar" color-changer position="3 1.5 -4" radius="0.4" height="3" color="#FFC65D"></a-cylinder>

      <a-box position="0 0.75 -5" width="0.1" height="1.5" depth="0.6" color="#E91E63" physx-body="type: dynamic; mass: 2"></a-box>
      <a-box position="0 0.75 -5.5" width="0.1" height="1.5" depth="0.6" color="#9C27B0" physx-body="type: dynamic; mass: 2"></a-box>
      <a-box position="0 0.75 -6" width="0.1" height="1.5" depth="0.6" color="#673AB7" physx-body="type: dynamic; mass: 2"></a-box>
      <a-box position="0 0.75 -6.5" width="0.1" height="1.5" depth="0.6" color="#3F51B5" physx-body="type: dynamic; mass: 2"></a-box>
      <a-box position="0 0.75 -7" width="0.1" height="1.5" depth="0.6" color="#2196F3" physx-body="type: dynamic; mass: 2"></a-box>

      <a-box position="0 0.2 -2" width="1" height="0.4" depth="1" color="#333" physx-body="type: static"></a-box>
      <a-sphere class="klickbar" gravity-kick position="0 1.2 -2" radius="0.3" color="#00FF00" 
                physx-body="type: dynamic; mass: 3"
                animation="property: material.emissive; to: #00FF00; loop: true; dir: alternate; dur: 1000">
      </a-sphere>

      <a-sphere position="-2 1 -2" radius="0.8" color="#FF5722" physx-body="type: dynamic; mass: 0.5"></a-sphere>

    </a-scene>
  </body>
</html>
