<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quantum Sandbox - Universal Fix</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

    <script>
      // Komponente: Objekt-Stoß (Anti-Gravitation)
      AFRAME.registerComponent('quantum-kick', {
        init: function () {
          this.el.addEventListener('click', () => {
            if (this.el.body) {
              this.el.body.applyImpulse(
                {x: (Math.random() - 0.5) * 5, y: 12, z: (Math.random() - 0.5) * 5}, 
                {x: 0, y: 0, z: 0}
              );
            }
          });
        }
      });

      // Komponente: Farb-Wechsler
      AFRAME.registerComponent('color-flip', {
        init: function () {
          this.el.addEventListener('click', () => {
            const colors = ['#38bdf8', '#818cf8', '#fbbf24', '#f87171'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            this.el.setAttribute('material', 'color', randomColor);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene physx="autoLoad: true; delay: 1000; wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/lib/physx.release.wasm">
      
      <a-assets>
        <img id="grid" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
      </a-assets>

      <a-entity id="cameraRig">
        <a-camera id="head" look-controls position="0 1.6 0"></a-camera>
        
        <a-entity laser-controls="hand: left"
                  raycaster="objects: .none; showLine: false;"
                  blink-controls="cameraRig: #cameraRig; 
                                  teleportOrigin: #head; 
                                  collisionEntities: #ground; 
                                  button: thumbstick; 
                                  curveStyle: curved; 
                                  snapTurn: true; 
                                  turnAngle: 45">
        </a-entity>

        <a-entity laser-controls="hand: right"
                  raycaster="objects: .clickable; far: 20; showLine: true; lineColor: #FFFFFF; lineOpacity: 0.8"
                  cursor="rayOrigin: entity">
        </a-entity>
      </a-entity>

      <a-plane id="ground" src="#grid" rotation="-90 0 0" width="100" height="100" repeat="40 40" physx-body="type: static"></a-plane>
      <a-sky color="#020617"></a-sky> 
      <a-ambient-light intensity="0.5"></a-ambient-light>
      <a-point-light position="2 5 3" intensity="0.8"></a-point-light>

      <a-box class="clickable" color-flip position="-4 1 -6" width="1.5" height="2" depth="1.5" color="#38bdf8"></a-box>
      <a-box class="clickable" color-flip position="4 1 -6" width="1.5" height="2" depth="1.5" color="#818cf8"></a-box>

      <a-entity position="0 0 -8">
        <a-box position="-1.5 1 0" width="0.2" height="2" depth="0.8" color="#f87171" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="-0.75 1 0" width="0.2" height="2" depth="0.8" color="#f87171" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0 1 0" width="0.2" height="2" depth="0.8" color="#f87171" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0.75 1 0" width="0.2" height="2" depth="0.8" color="#f87171" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="1.5 1 0" width="0.2" height="2" depth="0.8" color="#f87171" physx-body="type: dynamic; mass: 2"></a-box>
      </a-entity>

      <a-sphere class="clickable" quantum-kick position="0 3 -5" radius="0.5" color="#fbbf24" 
                physx-body="type: dynamic; mass: 1"
                animation="property: material.emissive; to: #fbbf24; dur: 500; loop: true; dir: alternate">
      </a-sphere>

      <a-cylinder position="-2 0.5 -3" radius="0.3" height="1" color="#10b981" physx-body="type: dynamic"></a-cylinder>
      <a-cylinder position="2 0.5 -3" radius="0.3" height="1" color="#10b981" physx-body="type: dynamic"></a-cylinder>

    </a-scene>
  </body>
</html>
