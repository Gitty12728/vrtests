<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Meta Quest - Echte Wurf-Physik</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/dist/aframe-physics-system.min.js"></script>

    <script>
      AFRAME.registerComponent('vr-gun', {
        init: function () {
          this.el.addEventListener('triggerdown', () => {
            var scene = this.el.sceneEl;
            var bullet = document.createElement('a-sphere');
            
            // 1. Startposition an der echten Hand ermitteln
            var gunMatrix = this.el.object3D.matrixWorld;
            var position = new THREE.Vector3();
            position.setFromMatrixPosition(gunMatrix);
            
            // 2. Richtung berechnen (wohin zeigt der Controller)
            var direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(this.el.object3D.quaternion);
            
            // Startpunkt kurz vor dem Lauf
            bullet.setAttribute('position', {
              x: position.x + direction.x * 0.4,
              y: position.y + direction.y * 0.4,
              z: position.z + direction.z * 0.4
            });
            
            // Aussehen der Wurfkugel (Etwas größer, wie ein schwerer Tennisball)
            bullet.setAttribute('radius', '0.08');
            bullet.setAttribute('color', '#FF9800'); // Sattes Orange
            bullet.setAttribute('material', 'roughness: 0.3; metalness: 0.1');
            
            // HIER DIE ANPASSUNG: Höhere Masse für echte Schwerkraft-Wirkung
            bullet.setAttribute('physx-body', 'type: dynamic; mass: 5.0; linearDamping: 0.01');
            scene.appendChild(bullet);

            // 3. Der physikalische Abschuss
            bullet.addEventListener('physics-ready', () => {
              // Wuchtige Geschwindigkeit für eine saubere ballistische Kurve
              var launchVelocity = 28; 
              
              bullet.body.applyImpulse(
                { 
                  x: direction.x * launchVelocity, 
                  y: direction.y * launchVelocity, 
                  z: direction.z * launchVelocity 
                },
                { x: 0, y: 0, z: 0 }
              );
            });

            // Projektile nach 6 Sekunden löschen, damit die Performance stabil bleibt
            setTimeout(() => {
              if(bullet.parentNode) bullet.parentNode.removeChild(bullet);
            }, 6000);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene physx="autoLoad: true; delay: 1000; gravity: 0 -9.81 0; wasmUrl: https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.3.0/lib/physx.release.wasm">
      
      <a-assets>
        <img id="gras" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
      </a-assets>

      <a-entity id="cameraRig" movement-controls="controls: gamepad; speed: 0.15">
        <a-camera id="head" look-controls position="0 1.6 0"></a-camera>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <a-entity oculus-touch-controls="hand: right" vr-gun
                  raycaster="objects: .klickbar; far: 15; showLine: true; lineColor: #FFFFFF; lineOpacity: 0.5"
                  cursor="rayOrigin: entity">
          
          <a-box position="0 0 -0.15" width="0.03" height="0.04" depth="0.25" color="#37474F"></a-box>
          <a-cylinder position="0 0.005 -0.28" rotation="90 0 0" radius="0.012" height="0.04" color="#cfd8dc"></a-cylinder>
          
          <a-entity snap-turn-controls="reference: #cameraRig; turnAngle: 45"></a-entity>
        </a-entity>
      </a-entity>

      <a-plane id="ground" src="#gras" rotation="-90 0 0" width="100" height="100" repeat="50 50" physx-body="type: static"></a-plane>
      <a-sky color="#0a0a15"></a-sky>
      <a-ambient-light intensity="0.6"></a-ambient-light>
      <a-directional-light position="2 4 -3" intensity="0.8"></a-directional-light>

      <a-box position="0 0.5 -8" rotation="15 0 0" width="4" height="0.1" depth="5" color="#00bcd4" physx-body="type: static"></a-box>
      <a-box position="-2 0.8 -8" rotation="15 0 0" width="0.1" height="0.6" depth="5" color="#212121" physx-body="type: static"></a-box>
      <a-box position="2 0.8 -8" rotation="15 0 0" width="0.1" height="0.6" depth="5" color="#212121" physx-body="type: static"></a-box>

      <a-entity position="0 0 -11">
        <a-box position="-0.6 0.2 0" width="0.35" height="0.4" depth="0.35" color="#FFC65D" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="-0.2 0.2 0" width="0.35" height="0.4" depth="0.35" color="#FFC65D" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0.2 0.2 0" width="0.35" height="0.4" depth="0.35" color="#FFC65D" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0.6 0.2 0" width="0.35" height="0.4" depth="0.35" color="#FFC65D" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="-0.4 0.6 0" width="0.35" height="0.4" depth="0.35" color="#EF2D5E" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0 0.6 0" width="0.35" height="0.4" depth="0.35" color="#EF2D5E" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0.4 0.6 0" width="0.35" height="0.4" depth="0.35" color="#EF2D5E" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="-0.2 1.0 0" width="0.35" height="0.4" depth="0.35" color="#4CAF50" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0.2 1.0 0" width="0.35" height="0.4" depth="0.35" color="#4CAF50" physx-body="type: dynamic; mass: 2"></a-box>
        <a-box position="0 1.4 0" width="0.35" height="0.4" depth="0.35" color="#9C27B0" physx-body="type: dynamic; mass: 2"></a-box>
      </a-entity>

      <a-box position="2.5 4 -6" width="0.2" height="0.2" depth="0.2" color="#333" physx-body="type: static"></a-box>
      <a-sphere position="2.5 2 -6" radius="0.4" color="#757575" physx-body="type: dynamic; mass: 15"></a-sphere>

    </a-scene>
  </body>
</html>
