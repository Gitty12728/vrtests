<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>VR Playground - 3 funktionierende Plattformen</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    
    <script>
      // Hover-Feedback für die Menü-Kacheln (Kachel hebt sich leicht an)
      AFRAME.registerComponent('kachel-feedback', {
        init: function () {
          let el = this.el;
          let originalPos = el.getAttribute('position');
          
          el.addEventListener('mouseenter', function () {
            el.setAttribute('animation__hover', {
              property: 'position',
              to: `${originalPos.x} ${originalPos.y + 0.05} ${originalPos.z}`,
              dur: 150,
              easing: 'easeOutQuad'
            });
            el.setAttribute('material', 'color', '#ffffff');
          });
          
          el.addEventListener('mouseleave', function () {
            el.setAttribute('animation__hover', {
              property: 'position',
              to: `${originalPos.x} ${originalPos.y} ${originalPos.z}`,
              dur: 150,
              easing: 'easeOutQuad'
            });
            el.setAttribute('material', 'color', el.getAttribute('data-basecolor'));
          });
        }
      });

      // Teleport Logik mit sanftem Abblenden/Einblenden (Fade)
      AFRAME.registerComponent('teleport-to', {
        schema: { x: {type: 'number'}, z: {type: 'number'} },
        init: function () {
          let el = this.el;
          let data = this.data;
          let fadePlane = document.querySelector('#fadeOverlay');
          let rig = document.querySelector('#rig');

          el.addEventListener('click', function () {
            fadePlane.emit('fadeOut');
            
            setTimeout(() => {
              // Spieler exakt versetzen
              rig.setAttribute('position', {x: data.x, y: 0, z: data.z});
              fadePlane.emit('fadeIn');
            }, 450);
          });
        }
      });
    </script>
  </head>
  <body>

    <a-scene xr-mode-ui="XRMode: xr" cursor="rayOrigin: mouse">
      
      <a-assets>
        <audio id="ambientWind" src="wind.mp3" preload="auto"></audio>
        
        <video id="videoPlattform1" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        <video id="videoPlattform2" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        <video id="videoPlattform3" src="video.mp4" loop="true" crossorigin="anonymous" playsinline></video>
      </a-assets>

      <a-sky color="#0f172a"></a-sky>
      <a-entity sound="src: #ambientWind; autoplay: true; loop: true; volume: 0.4"></a-entity>
      <a-ambient-light type="ambient" color="#666"></a-ambient-light>
      <a-entity light="type: directional; intensity: 0.6; castShadow: true;" position="-2 5 3"></a-entity>


      <a-entity position="0 0 0">
        <a-plane class="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#1e293b" shadow="receive: true"></a-plane>
        <a-grid src="https://raw.githubusercontent.com/aframevr/aframe/master/examples/primitives/models/grid.png" size="50" bounds="25 25"></a-grid>
        
        <a-box position="0 2 -5.8" width="5" height="2.8" depth="0.1" color="#111827">
          <a-video src="#videoPlattform1" position="0 0 0.06" width="4.8" height="2.6" sound="src: #videoPlattform1; autoplay: true; loop: true; positional: true; refDistance: 3; maxDistance: 30;"></a-video>
        </a-box>
        
        <a-entity position="-4 0 -4.5">
          <a-cylinder color="#a1a1aa" radius="0.3" height="0.6" shadow></a-cylinder>
          <a-sphere color="#15803d" radius="0.5" position="0 0.7 0" shadow></a-sphere>
        </a-entity>

        <a-entity position="0 0.01 1.5">
          <a-box color="#4b5563" position="-1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box class="klickbar" kachel-feedback teleport-to="x: 50; z: 0" data-basecolor="#3b82f6" color="#3b82f6" position="0 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box class="klickbar" kachel-feedback teleport-to="x: 100; z: 0" data-basecolor="#10b981" color="#10b981" position="1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
        </a-entity>
      </a-entity>


      <a-entity position="50 0 0">
        <a-plane class="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#1e293b" shadow="receive: true"></a-plane>
        <a-grid src="https://raw.githubusercontent.com/aframevr/aframe/master/examples/primitives/models/grid.png" size="50" bounds="25 25"></a-grid>
        
        <a-box position="0 2 -5.8" width="5" height="2.8" depth="0.1" color="#111827">
          <a-video src="#videoPlattform2" position="0 0 0.06" width="4.8" height="2.6" sound="src: #videoPlattform2; autoplay: true; loop: true; positional: true; refDistance: 3; maxDistance: 30;"></a-video>
        </a-box>
        
        <a-entity position="-4 0 -4.5">
          <a-cylinder color="#a1a1aa" radius="0.3" height="0.6" shadow></a-cylinder>
          <a-sphere color="#15803d" radius="0.5" position="0 0.7 0" shadow></a-sphere>
        </a-entity>

        <a-entity position="0 0.01 1.5">
          <a-box class="klickbar" kachel-feedback teleport-to="x: 0; z: 0" data-basecolor="#ef4444" color="#ef4444" position="-1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box color="#4b5563" position="0 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box class="klickbar" kachel-feedback teleport-to="x: 100; z: 0" data-basecolor="#10b981" color="#10b981" position="1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
        </a-entity>
      </a-entity>


      <a-entity position="100 0 0">
        <a-plane class="ground" position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#1e293b" shadow="receive: true"></a-plane>
        <a-grid src="https://raw.githubusercontent.com/aframevr/aframe/master/examples/primitives/models/grid.png" size="50" bounds="25 25"></a-grid>
        
        <a-box position="0 2 -5.8" width="5" height="2.8" depth="0.1" color="#111827">
          <a-video src="#videoPlattform3" position="0 0 0.06" width="4.8" height="2.6" sound="src: #videoPlattform3; autoplay: true; loop: true; positional: true; refDistance: 3; maxDistance: 30;"></a-video>
        </a-box>
        
        <a-entity position="-4 0 -4.5">
          <a-cylinder color="#a1a1aa" radius="0.3" height="0.6" shadow></a-cylinder>
          <a-sphere color="#15803d" radius="0.5" position="0 0.7 0" shadow></a-sphere>
        </a-entity>

        <a-entity position="0 0.01 1.5">
          <a-box class="klickbar" kachel-feedback teleport-to="x: 0; z: 0" data-basecolor="#ef4444" color="#ef4444" position="-1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box class="klickbar" kachel-feedback teleport-to="x: 50; z: 0" data-basecolor="#3b82f6" color="#3b82f6" position="0 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
          <a-box color="#4b5563" position="1.2 0 0" width="0.8" height="0.02" depth="0.5"></a-box>
        </a-entity>
      </a-entity>


      <a-entity id="rig" position="0 0 0" movement-controls="controls: oculus-touch-controls; speed: 0.2">
        <a-entity id="camera" camera look-controls position="0 1.6 0">
           <a-plane id="fadeOverlay" position="0 0 -0.05" width="1" height="1"
                    material="color: #000000; transparent: true; opacity: 0; shader: flat"
                    animation__fadeOut="property: material.opacity; from: 0; to: 1; dur: 400; startEvents: fadeOut"
                    animation__fadeIn="property: material.opacity; from: 1; to: 0; dur: 400; startEvents: fadeIn">
           </a-plane>
        </a-entity>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right"
                  raycaster="objects: .klickbar; far: 15; lineColor: #3b82f6">
        </a-entity>
      </a-entity>

    </a-scene>
    
    <script>
      document.body.addEventListener('click', function () {
        // Startet alle drei Instanzen deines Videos, sobald du einmal in VR klickst
        document.querySelector('#videoPlattform1').play();
        document.querySelector('#videoPlattform2').play();
        document.querySelector('#videoPlattform3').play();
      }, { once: true });
    </script>
  </body>
</html>
