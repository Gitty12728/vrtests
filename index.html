<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Gröben Plattform - Sound entkoppelt</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
</head>

<body>
    <a-scene physics="gravity: 0">
        <a-assets>
            <img id="himmel" src="360.jpg">
            <img id="logo" src="logo.jpg">
            <video id="vid" src="Testvideo.mp4" loop="true" crossorigin="anonymous" playsinline muted></video>
            <audio id="audio-file" src="audio.mp3" crossorigin="anonymous"></audio>
            <a-asset-item id="mein-modell" src="modell.glb"></a-asset-item>
        </a-assets>

        <a-sky src="#himmel"></a-sky>

        <a-cylinder position="0 0 0" radius="3.0" height="0.1" color="#333333" static-body></a-cylinder>
        <a-entity id="bruestung">
            <a-box position="2.9 0.4 0" rotation="0 90 0" width="1.1" height="1.2" depth="0.3" static-body material="color: #fff; opacity: 0.6"></a-box>
            <a-box position="-2.9 0.4 0" rotation="0 90 0" width="1.1" height="1.2" depth="0.3" static-body material="color: #fff; opacity: 0.6"></a-box>
            <a-box position="0 0.4 2.9" rotation="0 0 0" width="1.1" height="1.2" depth="0.3" static-body material="color: #fff; opacity: 0.6"></a-box>
            <a-box position="0 0.4 -2.9" rotation="0 0 0" width="1.1" height="1.2" depth="0.3" static-body material="color: #fff; opacity: 0.6"></a-box>
        </a-entity>
        
        <a-entity gltf-model="#mein-modell" position="0 0 0" scale="1 1 1" static-body="shape: hull"></a-entity>
        
        <a-image src="#logo" position="0 3.5 -2.5" width="2.4" height="0.8"></a-image>
        <a-video id="screen" src="#vid" position="0 1.8 -1.5" width="2.4" height="1.35"></a-video>

        <a-entity id="sound-container" sound="src: #audio-file; volume: 1"></a-entity>

        <a-entity id="rig" movement-controls="speed: 0.15" position="0 0 0">
            <a-entity camera look-controls position="0 1.6 0" kinematic-body="radius: 0.4"></a-entity>
        </a-entity>

        <a-entity position="0 0.8 -1.5">
            <a-box class="clickable" id="play-btn" position="-0.4 0 0" width="0.5" height="0.3" color="#555"></a-box>
            <a-box class="clickable" id="stop-btn" position="0.4 0 0" width="0.5" height="0.3" color="#555"></a-box>
        </a-entity>
    </a-scene>

    <script>
        const video = document.querySelector('#vid');
        const sound = document.querySelector('#sound-container');
        
        document.querySelector('#play-btn').addEventListener('click', () => {
            video.play();
            sound.components.sound.playSound(); // Spielt das Audio-File separat ab
        });
        
        document.querySelector('#stop-btn').addEventListener('click', () => { 
            video.pause(); 
            video.currentTime = 0; 
            sound.components.sound.stopSound();
        });
    </script>
</body>
</html>
