<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Willkommen am Gröben</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

    <script>
        AFRAME.registerComponent('schritt-sound', {
            init: function () {
                this.playing = false;
                this.lastPosition = new THREE.Vector3();
                this.lastPosition.copy(this.el.object3D.position);
            },
            tick: function () {
                let currentPosition = this.el.object3D.position;
                let dist = currentPosition.distanceTo(this.lastPosition);
                if (dist > 0.005) {
                    if (!this.playing) { this.el.components.sound.playSound(); this.playing = true; }
                } else {
                    if (this.playing) { this.el.components.sound.stopSound(); this.playing = false; }
                }
                this.lastPosition.copy(currentPosition);
            }
        });
    </script>
</head>
<body>
    <a-scene physics="debug: false">
        <a-assets>
            <img id="mein-himmel" src="360.jpg">
            <audio id="schritt" src="step.mp3" preload="auto"></audio>
        </a-assets>

        <a-sky src="#mein-himmel" rotation="0 -90 0"></a-sky>

        <a-text value="Willkommen am Groeben" 
                align="center" 
                color="#ffffff" 
                position="0 3.5 -4" 
                width="8" 
                side="double">
        </a-text>

        <a-box static-body position="0 -0.1 0" width="12" height="0.2" depth="12" color="#3e4444"></a-box>

        <a-box static-body position="0 0.5 6" width="12" height="1" depth="0.5" color="#7a6a53"></a-box>
        <a-box static-body position="0 0.5 -6" width="12" height="1" depth="0.5" color="#7a6a53"></a-box>
        <a-box static-body position="6 0.5 0" width="0.5" height="1" depth="13" color="#7a6a53"></a-box>
        <a-box static-body position="-6 0.5 0" width="0.5" height="1" depth="13" color="#7a6a53"></a-box>

        <a-entity id="rig" 
                  movement-controls="controls: gamepad, keyboard; speed: 0.15"
                  position="0 0 0"
                  sound="src: #schritt; loop: true; volume: 0.5"
                  schritt-sound>
            <a-entity camera look-controls position="0 1.6 0" dynamic-body="shape: cylinder; cylinderAxis: y; mass: 1"></a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
