<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Gröben Plattform - Controller-Steuerung</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
</head>

<body>
    <a-scene>
        <a-assets>
            <video id="testvideo" src="Testvideo.mp4" loop="true" crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-video src="#testvideo" position="0 1.8 -1.5" width="2.4" height="1.35" material="shader: flat"></a-video>

        <a-entity position="0 0.8 -1.5">
            <a-box class="clickable" id="play-btn" position="-0.4 0 0" width="0.5" height="0.3" depth="0.05" color="#444">
                <a-text value="▶" align="center" position="0 0 0.03" scale="0.8 0.8 0.8"></a-text>
            </a-box>
            <a-box class="clickable" id="stop-btn" position="0.4 0 0" width="0.5" height="0.3" depth="0.05" color="#444">
                <a-text value="⏹" align="center" position="0 0 0.03" scale="0.6 0.6 0.6"></a-text>
            </a-box>
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.15">
            <a-entity camera look-controls position="0 1.6 0"></a-entity>
            
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; showLine: true"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; showLine: true"></a-entity>
        </a-entity>

        </a-scene>

    <script>
        document.querySelector('#play-btn').addEventListener('click', () => document.querySelector('#testvideo').play());
        document.querySelector('#stop-btn').addEventListener('click', () => {
            const vid = document.querySelector('#testvideo');
            vid.pause();
            vid.currentTime = 0;
        });
    </script>
</body>
</html>
