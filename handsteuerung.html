<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Büro für Technische Kommunikation - VR Hand Tracking Fix</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    AFRAME.registerComponent('hand-rotator', {
      init: function () {
        var el = this.el;
        this.isPinching = false;
        this.lastX = 0;
        
        // Wir holen uns die Hand-Entitäten
        this.rightHand = document.querySelector('#rightHand');
        var self = this;

        // Nutzen der nativen WebXR-Events, die das Quest-Systemmenü umgehen
        this.rightHand.addEventListener('webxrhandconnected', function() {
          console.log("Hand erfolgreich im WebXR-Modus registriert!");
        });

        // A-Frame mäßiges Abfangen der Geste direkt über das Controller/Hand-Interface
        this.rightHand.addEventListener('gripdown', function() { self.startRotate(); });
        this.rightHand.addEventListener('triggerdown', function() { self.startRotate(); });
        this.rightHand.addEventListener('gripup', function() { self.isPinching = false; });
        this.rightHand.addEventListener('triggerup', function() { self.isPinching = false; });
        
        // Fallback für die Standard-Pinch-Events
        this.rightHand.addEventListener('pinchstarted', function(evt) {
          self.startRotate(evt.detail.position);
        });
        this.rightHand.addEventListener('pinchended', function() {
          self.isPinching = false;
        });
      },

      startRotate: function(handPos) {
        var el = this.el;
        var currentHandPos = handPos || this.rightHand.object3D.position;
        var objPos = el.object3D.position;
        var distance = currentHandPos.distanceTo(objPos);
        
        // Erhöhter Radius auf 60cm, um das Greifen zu erleichtern
        if (distance < 0.6) {
          this.isPinching = true;
          this.lastX = this.rightHand.object3D.position.x;
        }
      },

      tick: function () {
        if (!this.isPinching) return;
        var currentX = this.rightHand.object3D.position.x;
        var deltaX = currentX - this.lastX;
        
        // Rotation anwenden
        this.el.object3D.rotation.y += deltaX * 6;
        this.lastX = currentX;
      }
    });
  </script>
</head>
<body>

  <a-scene webxr="requiredFeatures: hand-tracking; optionalFeatures: local-floor;" xr-mode-ui="XRMode: vr" renderer="colorManagement: true;">
    
    <a-sky color="#020205"></a-sky>
    <a-grid width="30" height="30" color="#0a0a10" grid-color="#1a1a25"></a-grid>
    <a-entity light="type: ambient; color: #fff; intensity: 0.15"></a-entity>
    <a-entity light="type: spot; color: #00ffff; intensity: 5; angle: 30" position="0 4 -0.5" rotation="-90 0 0"></a-entity>

    <a-cylinder position="0 0.5 -0.5" radius="0.5" height="1" color="#111116"></a-cylinder>

    <a-entity id="tech-core" position="0 1.35 -0.5" hand-rotator>
      <a-sphere radius="0.12" color="#00ffcc" material="emissive: #00ffcc; emissiveIntensity: 0.3;"></a-sphere>
      <a-torus radius="0.3" radius-tubular="0.02" color="#778899" rotation="30 45 0"></a-torus>
      <a-torus radius="0.3" radius-tubular="0.02" color="#b0c4de" rotation="-30 45 90"></a-torus>
      <a-cylinder radius="0.02" height="0.7" color="#ff3366" rotation="90 0 0"></a-cylinder>
    </a-entity>

    <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>

    <a-entity camera position="0 1.6 0.8" look-controls></a-entity>

  </a-scene>

</body>
</html>
