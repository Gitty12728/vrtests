<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>VR Industrie-Training: Ventil-Rotation (Gefixt)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    AFRAME.registerComponent('native-joint-physik', {
      init: function () {
        this.objPos = new THREE.Vector3();
        this.fingerPos = new THREE.Vector3();
        this.isTouching = false;
        this.lastX = 0;
        
        // Referenz auf das visuelle Rad für das Farb-Feedback
        this.valveWheel = document.querySelector('#valve-wheel');
      },

      tick: function () {
        var sceneEl = this.el.sceneEl;
        var frame = sceneEl.frame;
        var xrSession = sceneEl.xrSession;
        
        // Wenn wir nicht im echten VR-Modus sind, abbrechen
        if (!frame || !xrSession) return;
        
        var inputSources = xrSession.inputSources;
        var foundCollision = false;
        var currentX = 0;
        
        // Hole die exakte Weltposition des Ventils
        this.el.object3D.getWorldPosition(this.objPos);
        
        // Wir gehen alle Eingabequellen (Hände) durch
        for (var i = 0; i < inputSources.length; i++) {
          var inputSource = inputSources[i];
          
          if (inputSource.hand) {
            // Wir holen uns die exakte Fingerspitze des Zeigefingers
            var indexTip = inputSource.hand.get('index-finger-tip');
            var refSpace = sceneEl.renderer.xr.getReferenceSpace();
            
            if (indexTip && refSpace) {
              var pose = frame.getJointPose(indexTip, refSpace);
              if (pose) {
                // Das sind die echten Raum-Koordinaten deines Fingers
                this.fingerPos.set(
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z
                );
                
                // Berechne den Abstand zwischen Fingerspitze und Ventilzentrum
                var distance = this.fingerPos.distanceTo(this.objPos);
                
                // Aktivierungs-Radius: 40 Zentimeter um das Rad herum
                if (distance < 0.4) {
                  foundCollision = true;
                  currentX = this.fingerPos.x;
                  break; 
                }
              }
            }
          }
        }
        
        // Physik-Logik ausführen
        if (foundCollision) {
          if (!this.isTouching) {
            this.isTouching = true;
            this.lastX = currentX;
            // VISUELLES FEEDBACK: Ventil wird bei Berührung rot
            if (this.valveWheel) this.valveWheel.setAttribute('color', '#ff3300');
          }
          
          // Berechne die Bewegung des Fingers auf der X-Achse
          var deltaX = currentX - this.lastX;
          
          // Drehung um die Z-Achse (wie ein Steuerrad)
          this.el.object3D.rotation.z += deltaX * 8;
          
          this.lastX = currentX;
        } else {
          if (this.isTouching) {
            this.isTouching = false;
            // Zurücksetzen auf die Standardfarbe Gelb
            if (this.valveWheel) this.valveWheel.setAttribute('color', '#ffcc00');
          }
        }
      }
    });
  </script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hand-tracking, local-floor;" renderer="colorManagement: true;">
    
    <a-sky color="#05050a"></a-sky>
    <a-grid width="30" height="30" color="#0f0f15" grid-color="#1c1c28"></a-grid>

    <a-entity light="type: ambient; color: #fff; intensity: 0.15"></a-entity>
    <a-entity light="type: spot; color: #ffffff; intensity: 6; angle: 40; penumbra: 0.6" position="0 4 -0.6" rotation="-90 0 0"></a-entity>

    <a-cylinder position="0 0.5 -0.6" radius="0.4" height="1" color="#181822" material="roughness: 0.4; metalness: 0.6;"></a-cylinder>

    <a-entity id="valve-system" position="0 1.35 -0.6" native-joint-physik>
      
      <a-torus id="valve-wheel" radius="0.32" radius-tubular="0.03" color="#ffcc00" material="roughness: 0.4; metalness: 0.2;"></a-torus>
      
      <a-cylinder radius="0.018" height="0.64" color="#cca300" rotation="0 0 0" material="roughness: 0.4;"></a-cylinder>
      <a-cylinder radius="0.018" height="0.64" color="#cca300" rotation="0 0 90" material="roughness: 0.4;"></a-cylinder>
      
      <a-cylinder radius="0.05" height="0.06" color="#555" rotation="90 0 0" material="metalness: 0.8; roughness: 0.2;"></a-cylinder>
      
    </a-entity>

    <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>

    <a-entity camera position="0 1.6 0.6" look-controls></a-entity>

  </a-scene>

</body>
</html>
