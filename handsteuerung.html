<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Büro für Technische Kommunikation - VR Training Demo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-super-hands-component@master/dist/super-hands.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hand-tracking" renderer="colorManagement: true;">
    
    <a-assets>
      <a-mixin id="grabable"
               hoverable grabbable stretchable draggable
               event-set__hoveron="_event: hover-start; material.opacity: 0.7"
               event-set__hoveroff="_event: hover-end; material.opacity: 1">
      </a-mixin>
    </a-assets>

    <a-sky color="#050508"></a-sky>
    <a-grid width="20" height="20" color="#111115" grid-color="#22222a"></a-grid>

    <a-entity light="type: ambient; color: #333; intensity: 0.5"></a-entity>
    
    <a-entity light="type: spot; color: #fff; intensity: 3; angle: 40; penumbra: 0.8" position="0 5 0" rotation="-90 0 0"></a-entity>

    <a-cylinder id="vitrine" 
                position="0 0.5 0" 
                radius="0.6" 
                height="1" 
                color="#1c1c24" 
                material="roughness: 0.2; metalness: 0.5;">
      
      <a-ring color="#00ffcc" radius-inner="0.55" radius-outer="0.58" position="0 0.51 0" rotation="-90 0 0" material="shader: flat;"></a-ring>
    </a-cylinder>

    <a-entity id="tech-object" 
              position="0 1.4 0" 
              scale="0.8 0.8 0.8"
              mixin="grabable"
              description="Greife dieses Objekt mit der Pinch-Geste, um es zu rotieren.">
      
      <a-sphere radius="0.15" color="#0077ff" material="roughness: 0.1; metalness: 0.8;"></a-sphere>
      
      <a-torus radius="0.35" radius-tubular="0.02" color="#cccccc" rotation="45 45 0"></a-torus>
      <a-torus radius="0.35" radius-tubular="0.02" color="#999999" rotation="-45 45 0"></a-torus>
      
      <a-cylinder radius="0.03" height="0.8" color="#ff3366" rotation="0 0 90"></a-cylinder>
      <a-cylinder radius="0.03" height="0.8" color="#ff3366" rotation="0 90 0"></a-cylinder>
      
      <a-box width="0.08" height="0.08" depth="0.08" position="0.4 0 0" color="#00ffcc"></a-box>
      <a-box width="0.08" height="0.08" depth="0.08" position="-0.4 0 0" color="#00ffcc"></a-box>
      <a-box width="0.08" height="0.08" depth="0.08" position="0 0.4 0" color="#00ffcc"></a-box>
      <a-box width="0.08" height="0.08" depth="0.08" position="0 -0.4 0" color="#00ffcc"></a-box>
    </a-entity>

    <a-entity id="left-hand"
              hand-tracking-controls="hand: left; modelStyle: mesh;"
              sphere-collider="objects: #tech-object;"
              super-hands="ColliderEvent: hitstart; ColliderEndEvent: hitend;">
    </a-entity>

    <a-entity id="right-hand"
              hand-tracking-controls="hand: right; modelStyle: mesh;"
              sphere-collider="objects: #tech-object;"
              super-hands="ColliderEvent: hitstart; ColliderEndEvent: hitend;">
    </a-entity>

    <a-entity camera position="0 1.6 1.5" look-controls>
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: #tech-object"></a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
