<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>VR Hand-Touch Rotation (Ohne Pinch)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <script>
    AFRAME.registerComponent('hand-touch-rotator', {
      init: function () {
        this.el = this.el;
        this.rightHand = document.querySelector('#rightHand');
        this.leftHand = document.querySelector('#leftHand');
        
        this.isTouching = false;
        this.lastX = 0;
        this.activeHand = null;
      },

      // Die Tick-Funktion läuft mit 90Hz und misst einfach nur den physikalischen Abstand
      tick: function () {
        var objPos = this.el.object3D.position;
        
        // 1. Prüfen, ob die rechte Hand nah genug am Objekt ist
        var rightHandPos = this.rightHand.object3D.position;
        var distRight = rightHandPos.distanceTo(objPos);
        
        // 2. Prüfen, ob die linke Hand nah genug am Objekt ist
        var leftHandPos = this.leftHand.object3D.position;
        var distLeft = leftHandPos.distanceTo(objPos);
        
        // Wir definieren einen Berührungs-Radius von 35 cm um das Objektzentrum
        var touchRadius = 0.35;
        
        if (distRight < touchRadius) {
          this.handleTouch(rightHandPos.x);
        } else if (distLeft < touchRadius) {
          this.handleTouch(leftHandPos.x);
        } else {
          // Keine Hand berührt das Objekt
          this.isTouching = false;
          this.activeHand = null;
          // Visuelles Feedback: Normaler Zustand
          this.el.setAttribute('material', 'wireframe', false);
        }
      },
      
      handleTouch: function(currentX) {
        if (!this.isTouching) {
          this.isTouching = true;
          this.lastX = currentX;
          // Visuelles Feedback: Objekt wird zum Gittermodell, wenn man es berührt
          this.el.setAttribute('material', 'wireframe', true);
        };
        
        // Berechne die Handbewegung seit dem letzten Frame
        var deltaX = currentX - this.lastX;
        
        // Drehe das Objekt (Multiplikator 8 für direkte Reaktion)
        this.el.object3D.rotation.y += deltaX * 8;
        
        this.lastX = currentX;
      }
    });
  </script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hand-tracking, local-floor;" renderer="colorManagement: true;">
    
    <a-sky color="#020205"></a-sky>
    <a-grid width="30" height="30" color="#0a0a10" grid-color="#1a1a25"></a-grid>
    <a-entity light="type: ambient; color: #fff; intensity: 0.15"></a-entity>
    <a-entity light="type: spot; color: #00ffff; intensity: 5; angle: 30" position="0 4 -0.5" rotation="-90 0 0"></a-entity>

    <a-cylinder position="0 0.5 -0.5" radius="0.5" height="1" color="#111116"></a-cylinder>

    <a-entity id="tech-core" position="0 1.35 -0.5" hand-touch-rotator>
      <a-sphere radius="0.12" color="#00ffcc" material="emissive: #00ffcc; emissiveIntensity: 0.3;"></a-sphere>
      <a-torus radius="0.3" radius-tubular="0.02" color="#778899" rotation="30 45 0"></a-torus>
      <a-torus radius="0.3" radius-tubular="0.02" color="#b0c4de" rotation="-30 45 90"></a-torus>
      <a-cylinder radius="0.02" height="0.7" color="#ff3366" rotation="90 0 0"></a-cylinder>
    </a-entity>

    <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;"></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;"></a-entity>

    <a-entity camera position="0 1.6 0.8" look-controls></a-entity>

  </a-scene>

</body>
</html>
