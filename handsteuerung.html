<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>VR Industrie-Training: MULTIPLAYER (FIXED)</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.slim.js"></script>
  <script src="https://unpkg.com/networked-aframe@0.12.0/dist/networked-aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('native-joint-physik', {
      init: function () {
        this.objPos = new THREE.Vector3();
        this.fingerPos = new THREE.Vector3();
        this.isTouching = false;
        this.lastX = 0;
        this.valveWheel = document.querySelector('#valve-wheel');
      },
      tick: function () {
        var sceneEl = this.el.sceneEl;
        var frame = sceneEl.frame;
        var xrSession = sceneEl.xrSession;
        if (!frame || !xrSession) return;
        
        var inputSources = xrSession.inputSources;
        var foundCollision = false;
        var currentX = 0;
        
        this.el.object3D.getWorldPosition(this.objPos);
        
        for (var i = 0; i < inputSources.length; i++) {
          var inputSource = inputSources[i];
          if (inputSource.hand) {
            var indexTip = inputSource.hand.get('index-finger-tip');
            var refSpace = sceneEl.renderer.xr.getReferenceSpace();
            if (indexTip && refSpace) {
              var pose = frame.getJointPose(indexTip, refSpace);
              if (pose) {
                this.fingerPos.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                var distance = this.fingerPos.distanceTo(this.objPos);
                if (distance < 0.4) {
                  foundCollision = true;
                  currentX = this.fingerPos.x;
                  break; 
                }
              }
            }
          }
        }
        
        if (foundCollision) {
          if (!this.isTouching) {
            this.isTouching = true;
            this.lastX = currentX;
            if (this.valveWheel) this.valveWheel.setAttribute('color', '#ff3300');
          }
          var deltaX = currentX - this.lastX;
          this.el.object3D.rotation.z += deltaX * 8;
          this.lastX = currentX;

          // Besitzrechte kurzzeitig übernehmen, um im Netzwerk zu senden
          if (this.el.components.networked && !NAF.utils.isMine(this.el)) {
            NAF.utils.takeOwnership(this.el);
          }
        } else {
          if (this.isTouching) {
            this.isTouching = false;
            if (this.valveWheel) this.valveWheel.setAttribute('color', '#ffcc00');
          }
        }
      }
    });
  </script>
</head>
<body>

  <a-scene networked-scene="
    room: privat-training-room-xyz999;
    debug: true;
    adapter: socketio;
    serverURL: https://naf.haydenlee.io/;
  " webxr="optionalFeatures: hand-tracking, local-floor;" renderer="colorManagement: true;">
    
    <a-assets>
      <template id="avatar-template">
        <a-entity class="avatar">
          <a-sphere class="head" color="#ff0055" radius="0.15"></a-sphere>
          <a-cone color="#ff0055" radius-bottom="0.05" radius-top="0" height="0.1" rotation="90 0 0" position="0 0 -0.15"></a-cone>
        </a-entity>
      </template>

      <template id="hand-template">
        <a-entity>
          <a-sphere radius="0.04" color="#00ffcc"></a-sphere>
        </a-entity>
      </template>
    </a-assets>

    <a-sky color="#05050a"></a-sky>
    <a-grid width="30" height="30" color="#0f0f15" grid-color="#1c1c28"></a-grid>
    <a-entity light="type: ambient; color: #fff; intensity: 0.15"></a-entity>
    <a-entity light="type: spot; color: #ffffff; intensity: 6; angle: 40" position="0 4 -0.6" rotation="-90 0 0"></a-entity>
    <a-cylinder position="0 0.5 -0.6" radius="0.4" height="1" color="#181822"></a-cylinder>

    <a-entity id="valve-system" position="0 1.35 -0.6" native-joint-physik>
      <a-torus id="valve-wheel" radius="0.32" radius-tubular="0.03" color="#ffcc00"></a-torus>
      <a-cylinder radius="0.018" height="0.64" color="#cca300" rotation="0 0 0"></a-cylinder>
      <a-cylinder radius="0.018" height="0.64" color="#cca300" rotation="0 0 90"></a-cylinder>
      <a-cylinder radius="0.05" height="0.06" color="#555" rotation="90 0 0"></a-cylinder>
    </a-entity>

    <a-entity id="player" networked="template:#avatar-template;attachTemplateToLocal:false;">
      <a-entity camera position="0 1.6 0.6" look-controls></a-entity>
      
      <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh;" networked="template:#hand-template;"></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh;" networked="template:#hand-template;"></a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
