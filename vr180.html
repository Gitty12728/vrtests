<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR 180 Stereo Video Player</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-stereo-component@0.5.0/dist/aframe-stereo-component.min.js"></script>
    
    <script>
      // Komponente für das Vor-/Zurückspringen im Video
      AFRAME.registerComponent('video-jump', {
        schema: { time: {type: 'number'} },
        init: function () {
          var video = document.getElementById('vr-video');
          this.el.addEventListener('click', () => {
            video.currentTime = this.data.time;
          });
        }
      });

      // Komponente für den Joystick-Zoom (DeoVR-Style)
      AFRAME.registerComponent('joystick-zoom', {
        init: function () {
          this.camera = document.getElementById('camera');
          
          // Wir hören auf Achsen-Bewegungen des Controllers
          this.el.addEventListener('axismove', (evt) => {
            // evt.detail.axis[1] ist bei den meisten VR-Controllern der Y-Wert des Joysticks (hoch/runter)
            let joystickY = evt.detail.axis[1]; 
            
            if (Math.abs(joystickY) > 0.1) { // Deadzone, um Zittern zu vermeiden
              // Wir ändern das Sichtfeld (FOV) der Kamera für den Zoom-Effekt
              let currentFov = this.camera.getAttribute('camera').fov;
              
              // Joystick nach oben = reinzoomen (FOV kleiner), nach unten = rauszoomen (FOV größer)
              let newFov = currentFov + (joystickY * 1.5); 
              
              // Grenzen setzen, damit das Bild nicht komplett flippt (z.B. zwischen 30 und 110 Grad)
              newFov = Math.max(30, Math.min(110, newFov));
              
              this.camera.setAttribute('camera', 'fov', newFov);
            }
          });
        }
      });
    </script>
  </head>
  <body>

    <a-scene>
      <a-assets>
        <video id="vr-video" src="dein-video.mp4" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-entity id="rig" position="0 0 0">
        <a-camera id="camera" stereo-camera="mode: stereo" look-controls></a-camera>
        
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10" joystick-zoom></a-entity>
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10" joystick-zoom></a-entity>
      </a-entity>

      <a-videosphere src="#vr-video" 
                     stereo="mode: top_bottom; eye: left" 
                     phi-length="180" 
                     rotation="0 90 0" 
                     scale="-1 1 1">
      </a-videosphere>
      <a-videosphere src="#vr-video" 
                     stereo="mode: top_bottom; eye: right" 
                     phi-length="180" 
                     rotation="0 90 0" 
                     scale="-1 1 1">
      </a-videosphere>

      <a-entity id="menu" position="0 1.2 -2" rotation="-10 0 0">
        
        <a-plane width="3.5" height="0.8" color="#111" opacity="0.8" position="0 0 0"></a-plane>
        <a-text value="Video Navigation (Sekunden)" align="center" position="0 0.25 0.01" scale="0.6 0.6 0.6" color="#FFF"></a-text>

        <a-plane class="clickable" video-jump="time: 2" width="0.8" height="0.3" position="-1 -0.1 0.01" color="#333"
                 animation__mouseenter="property: material.color; to: #555; startEvents: mouseenter; durability: 100"
                 animation__mouseleave="property: material.color; to: #333; startEvents: mouseleave; durability: 100">
          <a-text value="00:02" align="center" scale="0.5 0.5 0.5" color="#FFF"></a-text>
        </a-plane>

        <a-plane class="clickable" video-jump="time: 4" width="0.8" height="0.3" position="0 -0.1 0.01" color="#333"
                 animation__mouseenter="property: material.color; to: #555; startEvents: mouseenter; durability: 100"
                 animation__mouseleave="property: material.color; to: #333; startEvents: mouseleave; durability: 100">
          <a-text value="00:04" align="center" scale="0.5 0.5 0.5" color="#FFF"></a-text>
        </a-plane>

        <a-plane class="clickable" video-jump="time: 8" width="0.8" height="0.3" position="1 -0.1 0.01" color="#333"
                 animation__mouseenter="property: material.color; to: #555; startEvents: mouseenter; durability: 100"
                 animation__mouseleave="property: material.color; to: #333; startEvents: mouseleave; durability: 100">
          <a-text value="00:08" align="center" scale="0.5 0.5 0.5" color="#FFF"></a-text>
        </a-plane>

      </a-entity>

    </a-scene>

  </body>
</html>
