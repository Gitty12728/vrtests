<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <video id="vr-video" 
             src="https://gitty12728.github.io/vrtests/schnitt2.mp4" 
             crossorigin="anonymous" 
             playsinline>
      </video>
    </a-assets>

    <a-entity id="video-container">
      <a-videosphere 
        src="#vr-video" 
        rotation="0 -90 0" 
        theta-length="180" 
        phi-length="180"
        stereo="mode: side-by-side">
      </a-videosphere>
    </a-entity>

    <a-camera></a-camera>
  </a-scene>
</body>
</html>
