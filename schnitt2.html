<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meta Quest 2 - VR180 Stereo Fix</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script>
    // FIX FÜR AUGENTRENNUNG & ROTATION
    AFRAME.registerComponent('quest-stereo-control', {
      init: function () {
        this.leftDome = document.querySelector('#left-dome');
        this.rightDome = document.querySelector('#right-dome');

        // Textur-Split (Side-by-Side) direkt beim Laden zuweisen
        this.leftDome.addEventListener('object3dset', () => this.initDome(this.leftDome, 'left'));
        this.rightDome.addEventListener('object3dset', () => this.initDome(this.rightDome, 'right'));

        // RADIKALE AUGENTRENNUNG: Wir schalten die Kuppeln je nach Auge aktiv unsichtbar
        this.el.sceneEl.renderer.onBeforeRender = (scene, camera) => {
          if (camera.cameras && camera.cameras.length >= 2) {
            // camera.cameras[0] = Linkes Auge, camera.cameras[1] = Rechtes Auge
            var currentCam = camera;
            
            // Wenn Three.js die Unter-Kameras durchgeht:
            if (this.el.sceneEl.renderer.currentRenderState) {
              // Wir nutzen die native Render-Schleife, um die Sichtbarkeit pro Auge zu erzwingen
              this.leftDome.object3D.visible = (camera.bounds && camera.bounds.x === 0);
              this.rightDome.object3D.visible = (camera.bounds && camera.bounds.x > 0);
            }
          }
        };
      },

      initDome: function (el, eye) {
        var mesh = el.getObject3D('mesh');
        if (!mesh) return;

        // KORREKTUR DER VERDREHUNG: Wir drehen die 3D-Objekte direkt in Three.js
        // Das zwingt die Halbkugel, sich perfekt nach vorne (Norden) auszurichten
        mesh.rotation.y = Math.PI; // Entspricht 180 Grad Drehung im 3D-Raum

        // Side-by-Side Textur-Verteilung (Linke Hälfte links, Rechte Hälfte rechts)
        if (mesh.material && mesh.material.map) {
          var texture = mesh.material.map;
          texture.repeat.set(0.5, 1);
          if (eye === 'right') {
            texture.offset.set(0.5, 0);
          }
        }
      }
    });

    // CONTROLLER CORES (Unlock, Play/Pause, DeoVR-Zoom)
    AFRAME.registerComponent('player-core', {
      init: function () {
        var video = document.querySelector('#vr-video');
        var playBtn = document.querySelector('#play-button');
        var pauseBtn = document.querySelector('#pause-button');
        var barrier = document.querySelector('#vr-start-barrier');
        this.videoContainer = document.querySelector('#video-container');
        this.currentZ = 0.0;

        window.addEventListener('click', function unlock() {
          video.play().then(() => {
            barrier.setAttribute('visible', 'false');
            barrier.setAttribute('class', 'not-clickable');
            video.pause();
            window.removeEventListener('click', unlock);
          }).catch(e => console.log(e));
        });

        playBtn.addEventListener('click', function () { video.play(); });
        pauseBtn.addEventListener('click', function () { video.pause(); });

        // DeoVR Zoom per Joystick
        this.el.addEventListener('axismove', (evt) => {
          var joystickY = evt.detail.axis[1]; 
          if (Math.abs(joystickY) > 0.2) {
            this.currentZ += joystickY * 0.1; 
            this.currentZ = Math.min(3.0, Math.max(this.currentZ, -6.0));
            this.videoContainer.setAttribute('position', { x: 0, y: 0, z: this.currentZ });
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene player-core quest-stereo-control antialias="true">
    
    <a-assets>
      <video id="vr-video" src="https://gitty12728.github.io/vrtests/schnitt2.mp4" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera></a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-sky color="#000"></a-sky>

    <a-plane id="vr-start-barrier" class="clickable" position="0 1.5 -1.5" width="2" height="1" color="#222" opacity="0.9">
      <a-text value="IN VR WECHSELN\nDANACH HIERHIN KLICKEN" align="center" width="4" color="#FFF"></a-text>
    </a-plane>

    <a-entity id="video-container" position="0 0 0">
      
      <a-videosphere 
        id="left-dome"
        src="#vr-video"
        radius="12"
        phi-length="180"
        scale="-1 1 1">
      </a-videosphere>

      <a-videosphere 
        id="right-dome"
        src="#vr-video"
        radius="12"
        phi-length="180"
        scale="-1 1 1">
      </a-videosphere>
      
    </a-entity>

    <a-entity id="ui-menu" position="0 -0.7 -1.2" rotation="-30 0 0">
      <a-plane color="#111" width="0.7" height="0.25" opacity="0.9">
        <a-plane id="play-button" class="clickable" color="#118811" width="0.25" height="0.12" position="-0.16 0 0.01">
          <a-text value="PLAY" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
        <a-plane id="pause-button" class="clickable" color="#CC2222" width="0.25" height="0.12" position="0.16 0 0.01">
          <a-text value="PAUSE" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>

</body>
</html>
