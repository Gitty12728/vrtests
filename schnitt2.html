<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Echter VR180 SBS 3D Player</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/bellona/aframe-webxr-stereo-component@master/dist/aframe-webxr-stereo-component.min.js"></script>

  <script>
    // Play / Pause Steuerung
    AFRAME.registerComponent('video-controls', {
      init: function () {
        var video = document.querySelector('#vr-video');
        var playBtn = document.querySelector('#play-button');
        var pauseBtn = document.querySelector('#pause-button');
        var unlockBarrier = document.querySelector('#unlock-barrier');

        window.addEventListener('click', function unlock() {
          video.play().then(() => {
            unlockBarrier.setAttribute('visible', 'false');
            unlockBarrier.setAttribute('class', 'not-clickable');
            video.pause();
            window.removeEventListener('click', unlock);
          }).catch(e => console.error(e));
        });

        playBtn.addEventListener('click', function () {
          if (!unlockBarrier.getAttribute('visible')) video.play();
        });

        pauseBtn.addEventListener('click', function () {
          if (!unlockBarrier.getAttribute('visible')) video.pause();
        });
      }
    });

    // Zoom-Komponente (schiebt die Kugel vor/zurück)
    AFRAME.registerComponent('deovr-zoom', {
      init: function () {
        this.videoContainer = document.querySelector('#video-container');
        this.currentZ = 0.0;

        this.el.addEventListener('axismove', (evt) => {
          var joystickY = evt.detail.axis[1]; 
          if (Math.abs(joystickY) > 0.2) {
            this.currentZ += joystickY * 0.1; 
            this.currentZ = Math.min(2.0, Math.max(this.currentZ, -5.0));
            this.videoContainer.setAttribute('position', { x: 0, y: 0, z: this.currentZ });
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene video-controls xrwebvr="stereo: true">
    
    <a-assets>
      <video id="vr-video" src="https://gitty12728.github.io/vrtests/schnitt2.mp4" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera></a-camera>
      <a-entity laser-controls="hand: left" deovr-zoom></a-entity>
      <a-entity laser-controls="hand: right" deovr-zoom></a-entity>
    </a-entity>

    <a-sky color="#000"></a-sky>

    <a-plane id="unlock-barrier" class="clickable" position="0 1.6 -1" width="4" height="3" color="#222" opacity="0.8">
      <a-text value="KLICKE IN VR IRGENDWOHIN\nZUM STARTEN" align="center" width="6" color="#FFF"></a-text>
    </a-plane>

    <a-entity id="video-container" position="0 0 0">
      
      <a-videosphere 
        src="#vr-video"
        radius="10"
        phi-length="180"
        rotation="0 -90 0"
        scale="-1 1 1"
        webxr-stereo="eye: left; split: horizontal">
      </a-videosphere>

      <a-videosphere 
        src="#vr-video"
        radius="10"
        phi-length="180"
        rotation="0 -90 0"
        scale="-1 1 1"
        webxr-stereo="eye: right; split: horizontal">
      </a-videosphere>
      
    </a-entity>

    <a-entity id="ui-menu" position="0 -0.8 -1.2" rotation="-30 0 0">
      <a-plane color="#111" width="0.8" height="0.3" opacity="0.9">
        <a-plane id="play-button" class="clickable" color="#118811" width="0.3" height="0.15" position="-0.18 0 0.01">
          <a-text value="PLAY" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
        <a-plane id="pause-button" class="clickable" color="#CC2222" width="0.3" height="0.15" position="0.18 0 0.01">
          <a-text value="PAUSE" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
