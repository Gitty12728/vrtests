<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quest 2 - VR180 Professional Stereo Player</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script>
    // INDUSTRIE-STANDARD VR180 SBS SHADER
    // Dieser Shader rendert eine einzige Kugel, filtert aber die Pixel live nach Auge (links/rechts)
    AFRAME.registerShader('vr180-stereo-shader', {
      schema: {
        src: { type: 'map', is: 'uniform' }
      },
      
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        varying vec2 vUv;
        uniform sampler2D src;
        
        void main() {
          vec2 uv = vUv;
          
          // WebXR / Three.js gibt uns die Information, welches Auge gerade gerendert wird via gl_ViewID_OVR oder standardmäßig über die Kamera-Projektion
          // Da wir im Side-by-Side Format arbeiten:
          // Linkes Auge nutzt x von 0.0 bis 0.5
          // Rechtes Auge nutzt x von 0.5 bis 1.0
          
          #ifdef GL_FRAGMENT_PRECISION_HIGH
          precision highp float;
          #else
          precision mediump float;
          #endif
          
          // Prüfen welches Auge gerendert wird anhand der WebXR Kamera-Konfiguration
          if (gl_FrontFacing) {
            // Native Abfrage der Kamera-Position im Array (Links vs Rechts)
            if (projectionMatrix[2][0] < 0.0) {
              // Linkes Auge: Stauche die linke Videohälfte auf die ganze Breite
              uv.x = uv.x * 0.5;
            } else if (projectionMatrix[2][0] > 0.0) {
              // Rechtes Auge: Stauche die rechte Videohälfte auf die ganze Breite
              uv.x = 0.5 + (uv.x * 0.5);
            } else {
              // Fallback für den PC-Monitor (zeigt einfach die linke Seite)
              uv.x = uv.x * 0.5;
            }
          }
          
          gl_FragColor = texture2D(src, uv);
        }
      `
    });

    // CORE PLAYER STEUERUNG (Unlock, Play/Pause, DeoVR-Zoom)
    AFRAME.registerComponent('player-core', {
      init: function () {
        var video = document.querySelector('#vr-video');
        var playBtn = document.querySelector('#play-button');
        var pauseBtn = document.querySelector('#pause-button');
        var barrier = document.querySelector('#vr-start-barrier');
        this.videoContainer = document.querySelector('#video-container');
        this.currentZ = 0.0;

        window.addEventListener('click', function unlock() {
          video.play().then(() => {
            barrier.setAttribute('visible', 'false');
            barrier.setAttribute('class', 'not-clickable');
            video.pause();
            window.removeEventListener('click', unlock);
          }).catch(e => console.log(e));
        });

        playBtn.addEventListener('click', function () { video.play(); });
        pauseBtn.addEventListener('click', function () { video.pause(); });

        // Echter DeoVR Zoom per Joystick (verschiebt das Video auf der Z-Achse vor/zurück)
        this.el.addEventListener('axismove', (evt) => {
          var joystickY = evt.detail.axis[1]; 
          if (Math.abs(joystickY) > 0.2) {
            this.currentZ += joystickY * 0.1; 
            // Zoom-Grenzen im 3D-Raum
            this.currentZ = Math.min(3.0, Math.max(this.currentZ, -6.0));
            this.videoContainer.setAttribute('position', { x: 0, y: 0, z: this.currentZ });
          }
        });
      }
    });
  </script>
</head>
<body>

  <a-scene player-core antialias="true">
    
    <a-assets>
      <video id="vr-video" src="https://gitty12728.github.io/vrtests/schnitt2.mp4" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-entity id="rig" position="0 0 0">
      <a-camera></a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-sky color="#000"></a-sky>

    <a-plane id="vr-start-barrier" class="clickable" position="0 1.5 -1.5" width="2" height="1" color="#222" opacity="0.9">
      <a-text value="IN VR WECHSELN\nDANACH HIERHIN KLICKEN" align="center" width="4" color="#FFF"></a-text>
    </a-plane>

    <a-entity id="video-container" position="0 0 0">
      
      <a-videosphere 
        id="vr180-dome"
        material="shader: vr180-stereo-shader; src: #vr-video"
        radius="12"
        phi-start="0"
        phi-length="180"
        rotation="0 -90 0"
        scale="-1 1 1">
      </a-videosphere>
      
    </a-entity>

    <a-entity id="ui-menu" position="0 -0.7 -1.2" rotation="-30 0 0">
      <a-plane color="#111" width="0.7" height="0.25" opacity="0.9">
        <a-plane id="play-button" class="clickable" color="#118811" width="0.25" height="0.12" position="-0.16 0 0.01">
          <a-text value="PLAY" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
        <a-plane id="pause-button" class="clickable" color="#CC2222" width="0.25" height="0.12" position="0.16 0 0.01">
          <a-text value="PAUSE" align="center" width="2" color="#FFF"></a-text>
        </a-plane>
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
