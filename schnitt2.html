<!DOCTYPE html>
<html lang="de">
<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/orionshadow/aframe-stereo-component@master/dist/aframe-stereo-component.min.js"></script>
</head>
<body>
  <a-scene webxr="referenceSpaceType: local">
    <a-assets>
      <video id="vr-video" src="https://gitty12728.github.io/vrtests/schnitt2.mp4" crossorigin="anonymous" playsinline></video>
    </a-assets>

    <a-entity id="rig">
      <a-camera position="0 1.6 0"></a-camera>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

    <a-curvedimage 
      src="#vr-video" 
      radius="5.7" 
      theta-length="180" 
      rotation="0 90 0"
      height="6.4"
      stereo="mode: side-by-side">
    </a-curvedimage>

    <a-entity position="0 1.2 -1.5" id="ui-menu">
      <a-box id="play-btn" class="clickable" color="green" width="0.3" height="0.15" depth="0.05" position="-0.2 0 0">
        <a-text value="PLAY" align="center" position="0 0 0.03" scale="0.5 0.5 0.5"></a-text>
      </a-box>
      <a-box id="pause-btn" class="clickable" color="red" width="0.3" height="0.15" depth="0.05" position="0.2 0 0">
        <a-text value="PAUSE" align="center" position="0 0 0.03" scale="0.5 0.5 0.5"></a-text>
      </a-box>
    </a-entity>

    <script>
      const video = document.querySelector('#vr-video');
      document.querySelector('#play-btn').addEventListener('click', () => video.play());
      document.querySelector('#pause-btn').addEventListener('click', () => video.pause());
    </script>
  </a-scene>
</body>
</html>
